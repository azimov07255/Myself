function rwTotals(){if(RWT)return RWT;let xp=0;for(let i=0;i<RWDAYS;i++)xp+=dayPts(dAgo(i)).t;const r=rw();let bq=0,chest=0;for(const k in r.q){bq+=(r.q[k].c||[]).length;if(r.q[k].x)chest++}const wk=Object.keys(r.wk).length;xp+=bq*QXP+wk*WKXP;const earned=Math.floor(xp/10)+chest*QCOIN+wk*WKCOIN,spent=r.buy.reduce((a,b)=>a+(+b.c||0),0);return RWT={xp,earned,spent,coins:earned-spent,bq,chest,wk}}

function rwStreak(){let st=rwOk(dk())?1:0;for(let i=1;i<RWDAYS;i++){if(rwOk(dAgo(i)))st++;else break}return st}
function rwBest(){let b=0,c=0;for(let i=RWDAYS-1;i>=0;i--){if(rwOk(dAgo(i))){c++;b=Math.max(b,c)}else c=0}return b}

function rwQuests(k){const pool=RWQ.filter(q=>{try{return q.ap()}catch(e){return false}});let h=0;for(const c of k)h=(h*31+c.charCodeAt(0))>>>0;
  const rnd=()=>{h=(Math.imul(h,1664525)+1013904223)>>>0;return h/4294967296};
  const first=pool.find(q=>q.id==='hifz')||pool.find(q=>q.id==='top')||pool[0],pick=first?[first]:[];if(first)pool.splice(pool.indexOf(first),1);
  while(pick.length<3&&pool.length)pick.push(pool.splice(Math.floor(rnd()*pool.length),1)[0]);return pick}

const LB=[[39,9],[37,8.5],[35,8],[32,7.5],[30,7],[26,6.5],[23,6],[18,5.5],[16,5],[13,4.5],[10,4],[8,3.5],[6,3],[4,2.5]];

const ieRound=x=>Math.floor(x*2+0.5)/2;
const SK={L:'Listening',R:'Reading',W:'Writing',S:'Speaking'};
function ieSeries(){const o={L:[],R:[],W:[],S:[]};
  S.ie.tests.forEach(t=>{Object.keys(SK).forEach(k=>{if(t.b&&t.b[k]!=null)o[k].push({d:t.d,b:t.b[k]})})});
  S.ie.mock.forEach(m=>{const k={Listening:'L',Reading:'R',Writing:'W',Speaking:'S'}[m.t];if(k)o[k].push({d:m.d,b:m.b})});
  Object.values(o).forEach(a=>a.sort((x,y)=>x.d.localeCompare(y.d)));return o}
const ieCur=a=>a.length?r1(a.slice(-3).reduce((s,x)=>s+x.b,0)/Math.min(3,a.length)):null;
function ieStat(){const s=ieSeries(),c={};let n=0,sum=0;Object.keys(SK).forEach(k=>{c[k]=ieCur(s[k]);if(c[k]!==null){sum+=c[k];n++}});return{s,c,ov:n?ieRound(sum/n):null}}

  const plan=IPL.map(([k,t])=>`<button class="row ${dp[k]?'done':''}" onclick="ieTick('${k}')"><span class="ck">${dp[k]?'✓':''}</span><span class="t">${t}${k==='v'?` <span class="mu">(${due} ta navbatda)</span>`:''}</span></button>`).join('');

  return `<section class="hero"><p class="lab">IELTS</p><h1 style="font-size:46px">${st.ov===null?'—':st.ov}<span style="font-size:22px"> / ${T}</span></h1><p class="mu">Taxminiy umumiy ball (so‘nggi natijalaringdan)${exd!==null?`. Imtihongacha: ${exd>=0?exd+' kun, '+Math.ceil(exd/7)+' hafta':'o‘tib ketdi'}`:''}.</p>${foc&&foc.g>0?`<p style="margin-top:6px">Eng ko‘p e‘tibor: <b>${SK[foc.k]}</b>, maqsadgacha ${r1(foc.g)} ball.</p>`:''}</section>
  <div class="st"><div><b>${str} kun</b>ketma-ket mashq</div><div><b>${due}</b>lug‘at navbatda</div><div><b>${S.ie.words.length}</b>so‘z</div></div>

  if(k==='W'||k==='M'){const x=parseFloat(V('iw'));if(!(x>=0&&x<=9))return alert('Writing ballini 0–9 oralig‘ida yoz.');b.W=x}

  IT.iv=setInterval(()=>{const l=Math.max(0,Math.ceil((IT.end-Date.now())/1000)),e=document.getElementById('itm');if(e)e.textContent=fmtT(l);if(l<=0){clearInterval(IT.iv);if(navigator.vibrate)navigator.vibrate([250,120,250]);IT=null;if(next){SPQ.ph=2;spTimer(120,'Gapiring')}else render()}},500);render()}
function spStop(){if(IT)clearInterval(IT.iv);IT=null;render()}
function spRate(b){S.ie.tests.push({id:Date.now(),d:dk(),k:'S',src:'Speaking, Part '+SPQ.part,b:{S:b},raw:{}});ieDp().S=1;SPQ=null;if(IT)clearInterval(IT.iv);IT=null;save()}
function ieSpeak(){
  const q=SPQ,tl=IT?Math.max(0,Math.ceil((IT.end-Date.now())/1000)):0;
  const pick=`<div class="seg"><button onclick="spPick(1)">Part 1</button><button onclick="spPick(2)">Part 2</button><button onclick="spPick(3)">Part 3</button></div>`;
  let card='<p class="mu">Qismni tanla, tasodifiy savol chiqadi. Javobni ovoz chiqarib ayt va oxirida o‘zingni baho.</p>';
  if(q){card=`<div class="goal"><b>Part ${q.part}</b><p style="margin:8px 0;font-size:17px;line-height:1.45">${esc(q.q)}</p>
   ${IT?`<div class="tmr" id="itm">${fmtT(tl)}</div><p class="mu" style="text-align:center;margin:0 0 8px">${IT.label}</p><button class="btn s" style="width:100%" onclick="spStop()">To‘xtatish</button>`
   :q.part===2?`<button class="btn" style="width:100%;margin-bottom:6px" onclick="SPQ.ph=1;spTimer(60,'Tayyorlanish: 1 daqiqa',1)">1 daqiqa tayyorlanish, keyin 2 daqiqa gapirish</button>`
   :`<button class="btn" style="width:100%;margin-bottom:6px" onclick="spTimer(${q.part===1?30:60},'Gapiring')">${q.part===1?'30':'60'} soniya javob berish</button>`}
   <button class="btn ${SREC?'':'s'}" id="sprb" style="width:100%;margin:8px 0 0" onclick="spRec()">${SBUSY?'AI tinglamoqda… (30-60 soniya)':SREC?'⏹ Tugatish (0 s)':'🎙 Javobni yozib, AI ga tekshirtirish'}</button>
    <p class="mu" style="margin:8px 0 6px">O‘zingni bahola (ball):</p><div class="chips">${[5,5.5,6,6.5,7,7.5,8].map(b=>`<button onclick="spRate(${b})">${b}</button>`).join('')}</div></div>`}
  const hist=S.ie.tests.filter(t=>t.k==='S').slice(-6).reverse().map(t=>`<div class="row"><span class="t">${t.b.S}<br><span class="mu">${t.d.slice(8)}.${t.d.slice(5,7)}, ${esc(t.src||'')}</span></span>${t.fb?`<button class="x" style="font-size:14px" onclick="SOP=SOP===${t.id}?0:${t.id};render()">${SOP===t.id?'yopish':'AI izohi'}</button>`:''}</div>${SOP===t.id&&t.fb?ieFb(t.fb,String(t.id)):''}`).join('');
  return `${pick}${card}${SFB?ieFb(SFB,'s')+`<button class="big" style="margin:8px 0 0" onclick="spSaveAI()">Natijani saqlash (${esc(String(SFB.band))})</button>`:''}<h2>So‘nggi baholar</h2>${hist||'<p class="mu">Hali yozuv yo‘q.</p>'}`}

// ---- UNIVER: dars jadvali, fanlar, baho va davomat, topshiriq, imtihon ----
const UPAL=['#46c4b2','#e2b857','#d96f8f','#6f9fd8','#b27ad6','#e8855a','#7fb069','#c9a227'],UKIND=['Ma‘ruza','Amaliy','Laboratoriya','Seminar'];
let UV='b',UD=new Date().getDay();
const uSubj=id=>S.un.subj.find(x=>x.id===id),uCol=n=>{const s=S.un.subj.find(x=>x.n===n);return s?s.col:'var(--ln)'};
function uSub(id){return S.un.subj.length?`<select id="${id}" style="flex:1;min-width:0">${S.un.subj.map(s=>`<option value="${s.id}">${esc(s.n)}</option>`).join('')}</select>`:`<input id="${id}" placeholder="Fan nomi" style="flex:1;min-width:0">`}
const uName=v=>{const s=uSubj(v);return s?s.n:String(v||'').trim()};
function sbAdd(){const n=V('sbn');if(!n)return alert('Fan nomini yozing.');S.un.subj.push({id:'s'+Date.now(),n,cr:+V('sbc')||0,t:V('sbt'),lim:Math.round(+V('sbl'))||0,col:UPAL[S.un.subj.length%UPAL.length]});save()}
function sbDel(id){if(!confirm('Fan va uning darslari, baholari o‘chirilsinmi?'))return;S.un.subj=S.un.subj.filter(x=>x.id!==id);Object.keys(S.un.tt).forEach(d=>{S.un.tt[d]=S.un.tt[d].filter(x=>x.sid!==id)});delete S.un.gr[id];delete S.un.ab[id];save()}
function ttAdd(){const sid=V('tts'),s=V('ttst'),e=V('ttse');if(!uSubj(sid))return alert('Avval Fanlar bo‘limida fan qo‘shing.');if(!s||!e||t2m(e)<=t2m(s))return alert('Boshlanish va tugash vaqtini to‘g‘ri yozing.');
  const L=S.un.tt[UD]=S.un.tt[UD]||[];L.push({id:Date.now(),sid,s,e,r:V('ttr'),k:V('ttk')||UKIND[0]});L.sort((a,b)=>t2m(a.s)-t2m(b.s));save()}
function ttDel(d,id){S.un.tt[d]=(S.un.tt[d]||[]).filter(x=>x.id!==id);save()}
function grAdd(sid){const n=V('grn'+sid),sc=parseFloat(V('grs'+sid)),mx=parseFloat(V('grm'+sid))||100;if(!(sc>=0)||sc>mx)return alert('Ballni to‘g‘ri yozing.');(S.un.gr[sid]=S.un.gr[sid]||[]).push({id:Date.now(),n:n||'Baho',sc,mx});save()}
function grDel(sid,id){S.un.gr[sid]=(S.un.gr[sid]||[]).filter(x=>x.id!==id);save()}
function abAdd(sid,d){S.un.ab[sid]=Math.max(0,(S.un.ab[sid]||0)+d);save()}
function uAdd(){const t=V('ut');if(!t)return;S.un.tasks.push({id:Date.now(),t,s:uName(V('us')),due:V('ud'),x:0,imp:V('up')==='1'?1:0});save()}
function uEx(){const s=uName(V('ue')),d=V('ued');if(!s||!d)return alert('Fan va sanani yozing.');S.un.exams.push({id:Date.now(),s,d,tm:V('uet'),r:V('uer'),p:0});save()}
function uT(id){const t=S.un.tasks.find(x=>x.id===id);t.x=t.x?0:1;save()}
function exPrep(id,v){const e=S.un.exams.find(x=>x.id===id);if(e){e.p=+v||0;qsave()}}
const uAvg=sid=>{const g=S.un.gr[sid]||[],m=g.reduce((a,x)=>a+x.mx,0);return m?Math.round(g.reduce((a,x)=>a+x.sc,0)/m*100):null};
const uLessons=d=>(S.un.tt[d]||[]).slice().sort((a,b)=>t2m(a.s)-t2m(b.s));

// ---- Univer: tahrirlash ----
let UED='';
const uEdT=k=>{UED=UED===k?'':k;render()};
function sbEd(id,f,v){const s=uSubj(id);if(!s)return;
  if(f==='n'){const nn=String(v).trim();if(!nn)return;S.un.tasks.forEach(t=>{if(t.s===s.n)t.s=nn});S.un.exams.forEach(e=>{if(e.s===s.n)e.s=nn});s.n=nn}
  else if(f==='ab')S.un.ab[id]=Math.max(0,Math.round(+v)||0);
  else if(f==='cr'||f==='lim')s[f]=Math.max(0,Math.round(+v)||0);
  else s[f]=String(v);
  save()}
function ttEd(d,id,f,v){const L=(S.un.tt[d]||[]).find(x=>x.id===id);if(!L)return;const old=L[f];L[f]=v;
  if(!L.s||!L.e||t2m(L.e)<=t2m(L.s)){L[f]=old;alert('Tugash vaqti boshlanishdan keyin bo‘lsin.');render();return}
  S.un.tt[d].sort((a,b)=>t2m(a.s)-t2m(b.s));save()}
function tkEd(id,f,v){const t=S.un.tasks.find(x=>x.id===id);if(!t)return;if(f==='imp')t.imp=+v?1:0;else t[f]=String(v).trim();save()}
function exEd(id,f,v){const e=S.un.exams.find(x=>x.id===id);if(!e)return;if(f==='d'&&!v)return;e[f]=String(v).trim();save()}
const uNameSel=(cur,cb)=>{const names=S.un.subj.map(s=>s.n);if(cur&&!names.includes(cur))names.unshift(cur);return names.length?`<select style="width:100%;margin-top:4px" onchange="${cb}(this.value)">${names.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('')}</select>`:`<input value="${esc(cur||'')}" onchange="${cb}(this.value)" style="width:100%;margin-top:4px">`};
function uSubEd(s){const ab=S.un.ab[s.id]||0;
  return `<div class="un-ed"><label><span class="mu">Fan nomi</span><input value="${esc(s.n)}" onchange="sbEd('${s.id}','n',this.value)"></label>
  <label><span class="mu">O‘qituvchi</span><input value="${esc(s.t||'')}" onchange="sbEd('${s.id}','t',this.value)"></label>
  <div class="fg"><label><span class="mu">Kredit</span><input type="number" inputmode="numeric" value="${s.cr||''}" onchange="sbEd('${s.id}','cr',this.value)"></label><label><span class="mu">Qoldirish limiti</span><input type="number" inputmode="numeric" value="${s.lim||''}" onchange="sbEd('${s.id}','lim',this.value)"></label></div>
  <label><span class="mu">Qoldirilgan darslar soni</span><input type="number" inputmode="numeric" value="${ab}" onchange="sbEd('${s.id}','ab',this.value)"></label>
  <div class="mu" style="font-size:12px;margin-top:8px">Rang</div><div class="ucs">${UPAL.map(c=>`<button class="ucb" style="background:${c}" onclick="sbEd('${s.id}','col','${c}')">${s.col===c?'✓':''}</button>`).join('')}</div>
  <button class="btn" style="width:100%;margin-top:10px" onclick="UED='';render()">Tayyor</button></div>`}
function uLesEd(d,L){return `<div class="un-ed"><label><span class="mu">Fan</span><select style="width:100%;margin-top:4px" onchange="ttEd(${d},${L.id},'sid',this.value)">${S.un.subj.map(s=>`<option value="${s.id}" ${s.id===L.sid?'selected':''}>${esc(s.n)}</option>`).join('')}</select></label>
  <div class="fg1"><label><span class="mu">Boshlanishi</span><input type="time" value="${L.s}" onchange="ttEd(${d},${L.id},'s',this.value)"></label><label><span class="mu">Tugashi</span><input type="time" value="${L.e}" onchange="ttEd(${d},${L.id},'e',this.value)"></label></div>
  <div class="in"><select style="flex:1;min-width:0" onchange="ttEd(${d},${L.id},'k',this.value)">${UKIND.map(k=>`<option ${k===L.k?'selected':''}>${k}</option>`).join('')}</select><input value="${esc(L.r||'')}" placeholder="Xona" style="flex:1;min-width:0" onchange="ttEd(${d},${L.id},'r',this.value)"></div>
  <button class="btn" style="width:100%" onclick="UED='';render()">Tayyor</button></div>`}
function uTaskEd(t){return `<div class="un-ed"><label><span class="mu">Topshiriq</span><input value="${esc(t.t)}" onchange="tkEd(${t.id},'t',this.value)"></label><label><span class="mu">Fan</span>${uNameSel(t.s,"tkEd.bind(null,"+t.id+",'s')")}</label>
  <div class="fg1"><label><span class="mu">Muddati</span><input type="date" value="${t.due||''}" onchange="tkEd(${t.id},'due',this.value)"></label><label><span class="mu">Muhimligi</span><select style="width:100%;margin-top:4px" onchange="tkEd(${t.id},'imp',this.value)"><option value="0">Oddiy</option><option value="1" ${t.imp?'selected':''}>⭐ Muhim</option></select></label></div>
  <button class="btn" style="width:100%" onclick="UED='';render()">Tayyor</button></div>`}
function uExEd(e){return `<div class="un-ed"><label><span class="mu">Fan</span>${uNameSel(e.s,"exEd.bind(null,"+e.id+",'s')")}</label>
  <div class="fg1"><label><span class="mu">Sana</span><input type="date" value="${e.d}" onchange="exEd(${e.id},'d',this.value)"></label><label><span class="mu">Vaqt</span><input type="time" value="${e.tm||''}" onchange="exEd(${e.id},'tm',this.value)"></label></div>
  <label><span class="mu">Xona</span><input value="${esc(e.r||'')}" onchange="exEd(${e.id},'r',this.value)"></label><button class="btn" style="width:100%;margin-top:8px" onclick="UED='';render()">Tayyor</button></div>`}
function uLRow(L,del){const s=uSubj(L.sid)||{n:'Fan',col:'var(--ln)'};
  return `<div class="un-l" style="--c:${s.col}"><div class="un-t"><b>${L.s}</b><span class="mu">${L.e}</span></div><div class="un-b"><b>${esc(s.n)}</b><div class="mu" style="font-size:12px">${esc(L.k||'')}${L.r?' · '+esc(L.r):''}</div></div>${del!==undefined?`<button class="x" style="font-size:15px" onclick="uEdT('les:${L.id}')">✎</button><button class="x" onclick="ttDel(${del},${L.id})">×</button>`:''}</div>${del!==undefined&&UED==='les:'+L.id?uLesEd(del,L):''}`}
function uniCard(){const L=uLessons(new Date().getDay());if(!L.length)return '';const n=new Date(),m=n.getHours()*60+n.getMinutes();
  const cur=L.find(x=>m>=t2m(x.s)&&m<t2m(x.e)),nxt=L.find(x=>t2m(x.s)>m);
  const msg=cur?`Hozir: ${esc(uName(cur.sid))} (${cur.e} gacha)`:nxt?`Keyingi: ${esc(uName(nxt.sid))}, ${nxt.s} da`:'Bugungi darslar tugadi';
  return `<button class="row" style="margin-top:12px;border-left-color:var(--ac)" onclick="EV='u';UV='b';go('e')"><span class="t"><b>🎓 Bugun ${L.length} ta dars</b><br><span class="mu">${msg}</span></span></button>`}
function uView(){
  const u=S.un,T0=dk(),now=new Date(),m=now.getHours()*60+now.getMinutes();
  if(UV==='b'){
    const L=uLessons(now.getDay()),cur=L.find(x=>m>=t2m(x.s)&&m<t2m(x.e)),nxt=L.find(x=>t2m(x.s)>m);
    const open=u.tasks.filter(t=>!t.x),soon=open.filter(t=>t.due&&dl(t.due)<=2).sort((a,b)=>a.due>b.due?1:-1),ex=u.exams.filter(e=>dl(e.d)>=0).sort((a,b)=>a.d>b.d?1:-1)[0];
    const lines=L.map(x=>{const s=uSubj(x.sid)||{n:'Fan',col:'var(--ln)'},on=cur&&cur.id===x.id,past=m>=t2m(x.e);return `<div class="un-l ${on?'now':''}" style="--c:${s.col};${past?'opacity:.5':''}"><div class="un-t"><b>${x.s}</b><span class="mu">${x.e}</span></div><div class="un-b"><b>${esc(s.n)}</b><div class="mu" style="font-size:12px">${esc(x.k||'')}${x.r?' · '+esc(x.r):''}</div></div>${on?'<span class="chip-on">hozir</span>':nxt&&nxt.id===x.id?`<span class="mu" style="font-size:12px">${fmt(t2m(x.s)-m).trim()} dan keyin</span>`:''}</div>`}).join('');
    return `<section class="hero"><p class="lab">${DAYS[now.getDay()]}</p><h1 style="font-size:30px">${L.length?L.length+' ta dars':'Bugun dars yo‘q'}</h1><p class="mu">${cur?'Hozir: '+esc(uName(cur.sid)):nxt?'Keyingi: '+esc(uName(nxt.sid))+', '+nxt.s:L.length?'Bugungi darslar tugadi':'Dam olish yoki mustaqil tayyorgarlik kuni.'}</p></section>
    <div class="st"><div><b>${open.length}</b>topshiriq</div><div><b>${soon.length}</b>tez orada</div><div><b>${ex?dl(ex.d):'—'}</b>${ex?'kun: imtihon':'imtihon yo‘q'}</div></div>
    ${lines?`<h2>Bugungi darslar</h2>${lines}`:''}
    ${soon.length?`<h2>Muddati yaqin</h2>${soon.map(t=>`<div class="row"><span class="ck" onclick="uT(${t.id})"></span><span class="t" onclick="uT(${t.id})">${esc(t.t)}<br><span class="mu" style="color:var(--bad)">${t.s?esc(t.s)+', ':''}${dlTxt(dl(t.due))}</span></span></div>`).join('')}`:''}
    ${!u.subj.length?'<div class="bn wr">Boshlash uchun <b>Fanlar</b> bo‘limida fanlaringni qo‘sh, keyin <b>Jadval</b>da darslarni yoz.</div>':''}`}
  if(UV==='j'){
    const strip=[1,2,3,4,5,6,0].map(d=>`<button class="${UD===d?'on':''}" onclick="UD=${d};render()"><span style="display:block;font-size:11px;font-weight:600">${DAYS[d].slice(0,2)}${d===now.getDay()?' •':''}</span><b style="font-size:16px">${uLessons(d).length||'·'}</b></button>`).join('');
    const L=uLessons(UD);
    return `<div class="wkp">${strip}</div><h2>${DAYS[UD]}</h2>${L.map(x=>uLRow(x,UD)).join('')||'<p class="mu">Bu kunga dars qo‘yilmagan.</p>'}
    <details class="goal" style="margin-top:10px"${L.length?'':' open'}><summary style="font-weight:600">+ Dars qo‘shish</summary><div style="margin-top:10px"><div class="in">${uSub('tts')}</div>
    <div class="fg1"><label><span class="mu">Boshlanishi</span><input id="ttst" type="time" value="09:00"></label><label><span class="mu">Tugashi</span><input id="ttse" type="time" value="10:20"></label></div>
    <div class="in"><select id="ttk" style="flex:1;min-width:0">${UKIND.map(k=>`<option>${k}</option>`).join('')}</select><input id="ttr" placeholder="Xona" style="flex:1;min-width:0"></div><button class="big" style="margin:4px 0 0" onclick="ttAdd()">Darsni qo‘shish</button></div></details>`}
  if(UV==='f'){
    const cards=u.subj.map(s=>{const a=uAvg(s.id),ab=u.ab[s.id]||0,lim=s.lim||0,pc=lim?Math.min(100,ab/lim*100):0,bad=lim&&ab>=lim*0.8,g=(u.gr[s.id]||[]);
      return `<div class="goal" style="border-left:5px solid ${s.col}"><div class="h" style="align-items:flex-start"><div style="min-width:0"><b style="font-size:17px">${esc(s.n)}</b><div class="mu" style="font-size:12px">${s.t?esc(s.t):'o‘qituvchi yozilmagan'}${s.cr?' · '+s.cr+' kredit':''}</div></div><span><button class="x" style="font-size:16px" onclick="uEdT('sub:${s.id}')">✎</button><button class="x" onclick="sbDel('${s.id}')">×</button></span></div>${UED==='sub:'+s.id?uSubEd(s):''}
      <div class="un-m"><div><span class="mu">O‘rtacha ball</span><b>${a===null?'—':a+'%'}</b></div><div><span class="mu">Qoldirilgan dars</span><b style="${bad?'color:var(--bad)':''}">${ab}${lim?' / '+lim:''}</b></div></div>
      ${a!==null?`<div class="bar"><i style="width:${a}%;background:${s.col}"></i></div>`:''}
      <div class="in" style="margin:10px 0 0;align-items:center"><span class="mu" style="flex:1">Davomat${lim?'':' (limit qo‘yilmagan)'}</span><button class="btn s" style="padding:6px 14px" onclick="abAdd('${s.id}',-1)">−</button><button class="btn" style="padding:6px 14px" onclick="abAdd('${s.id}',1)">+ qoldirdim</button></div>
      ${lim?`<div class="bar" style="margin-top:6px"><i style="width:${pc}%;background:${bad?'var(--bad)':'var(--ac)'}"></i></div>${bad?`<p style="color:var(--bad);margin:6px 0 0;font-size:13px">⚠️ Limitga yaqinlashding: ${lim-ab>0?(lim-ab)+' ta qoldi':'limit tugadi'}.</p>`:''}`:''}
      ${g.length?`<div class="chips" style="margin-top:10px">${g.map(x=>`<button onclick="grDel('${s.id}',${x.id})" title="O‘chirish">${esc(x.n)}: ${x.sc}/${x.mx} ×</button>`).join('')}</div>`:''}

    return `${cards||'<p class="mu">Hali fan yo‘q. Quyida qo‘sh.</p>'}
    <details class="goal"${u.subj.length?'':' open'}><summary style="font-weight:600">+ Fan qo‘shish</summary><div style="margin-top:10px"><div class="in"><input id="sbn" placeholder="Fan nomi, masalan: Matematika"></div><div class="in"><input id="sbt" placeholder="O‘qituvchi (ixtiyoriy)"></div>

const DU=[{"id": "ak", "c": ["sb", "sh", "nm", "uy"], "k": 1, "t": "Oyatul Kursi (Baqara, 255)", "ar": "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ", "tr": "Allohu la ilaha illa huval hayyul qayyum, la ta’xuzuhu sinatun va la navm, lahu ma fis-samavati va ma fil-arz, man zal-lazi yashfa’u ‘indahu illa bi iznih, ya’lamu ma bayna aydihim va ma xalfahum, va la yuhituna bi shay’im min ‘ilmihi illa bima sha’, vasi’a kursiyyuhus-samavati val-arz, va la ya’uduhu hifzuhuma, va huval ‘aliyyul ‘azim.", "uz": "Alloh — Undan o‘zga iloh yo‘q, tirik va doimiy turuvchi. Uni na mudroq, na uyqu tutadi. Osmonlar va yerdagi hamma narsa Unikidir. Uning iznisiz kim Uning huzurida shafoat qila oladi? U ularning oldidagi va ortidagi narsalarni biladi. Ular Uning ilmidan U xohlagan narsadangina bilib oladilar. Kursiysi osmonlar va yerni qamrab olgan, ularni saqlash Uni charchatmaydi. U Oliy va Ulug‘dir."}, {"id": "ik", "c": ["sb", "sh", "uy"], "k": 3, "t": "Ixlos surasi", "ar": "قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ", "tr": "Qul huvallohu ahad. Allohus-samad. Lam yalid va lam yulad. Va lam yakun lahu kufuvan ahad.", "uz": "Ayt: U Alloh — yagonadir. Alloh behojatdir. U tug‘madi va tug‘ilmadi. Va Unga hech kim teng emas."}, {"id": "fl", "c": ["sb", "sh", "uy"], "k": 3, "t": "Falaq surasi", "ar": "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ", "tr": "Qul a’uzu birabbil-falaq. Min sharri ma xalaq. Va min sharri g‘osiqin iza vaqab. Va min sharrin-naffasati fil-‘uqad. Va min sharri hasidin iza hasad.", "uz": "Ayt: Tong Parvardigoriga sig‘inaman — U yaratgan narsalarning yomonligidan, qorong‘i tushganda kirgan zulmat yomonligidan, tugunlarga puflovchilarning yomonligidan va hasad qilganda hasadchining yomonligidan."}, {"id": "ns", "c": ["sb", "sh", "uy"], "k": 3, "t": "Nos surasi", "ar": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ", "tr": "Qul a’uzu birabbin-nas. Malikin-nas. Ilahin-nas. Min sharril-vasvasil-xannas. Allazi yuvasvisu fi suduril-nas. Minal jinnati van-nas.", "uz": "Ayt: Odamlar Parvardigoriga, odamlar Podshohiga, odamlar Ilohiga sig‘inaman — vasvasachi yashirinuvchi (shayton)ning yomonligidan; u odamlarning ko‘ksiga vasvasa soladi; jinlardan ham, odamlardan ham."}, {"id": "sa", "c": ["sb"], "k": 1, "t": "Ertalabki zikr", "ar": "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ", "tr": "Asbahna va asbahal-mulku lillah, val-hamdu lillah, la ilaha illallohu vahdahu la sharika lah.", "uz": "Biz tong ottirdik, mulk ham Allohniki bo‘lgan holda tong otdi. Hamd Allohgadir. Allohdan o‘zga iloh yo‘q, U yagonadir, Uning sherigi yo‘q."}, {"id": "ss", "c": ["sh"], "k": 1, "t": "Kechqurunggi zikr", "ar": "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ", "tr": "Amsayna va amsal-mulku lillah, val-hamdu lillah, la ilaha illallohu vahdahu la sharika lah.", "uz": "Biz kechga yetdik, mulk ham Allohniki bo‘lgan holda kech kirdi. Hamd Allohgadir. Allohdan o‘zga iloh yo‘q, U yagonadir, Uning sherigi yo‘q."}, {"id": "sb2", "c": ["sb"], "k": 1, "t": "Ertalab: Allohumma bika asbahna", "ar": "اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ", "tr": "Allohumma bika asbahna va bika amsayna va bika nahya va bika namutu va ilaykan-nushur.", "uz": "Ey Alloh, Sening ehsoning bilan tong ottirdik, Sening ehsoning bilan kech kirdirdik, Sen bilan tirilamiz, Sen bilan o‘lamiz va qaytish Senga."}, {"id": "sh2", "c": ["sh"], "k": 1, "t": "Kechqurun: Allohumma bika amsayna", "ar": "اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ", "tr": "Allohumma bika amsayna va bika asbahna va bika nahya va bika namutu va ilaykal-masir.", "uz": "Ey Alloh, Sening ehsoning bilan kech kirdirdik, Sening ehsoning bilan tong ottirdik, Sen bilan tirilamiz, Sen bilan o‘lamiz va qaytish Senga."}, {"id": "si", "c": ["sb", "sh"], "k": 1, "t": "Sayyidul istig‘for", "ar": "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", "tr": "Allohumma anta Rabbi, la ilaha illa ant, xalaqtani va ana ‘abduk, va ana ‘ala ‘ahdika va va‘dika mastata‘t, a‘uzu bika min sharri ma sana‘t, abu’u laka bini‘matika ‘alayya va abu’u bizanbi, fag‘firli fa innahu la yag‘firuz-zunuba illa ant.", "uz": "Ey Alloh, Sen mening Rabbimsan, Sendan o‘zga iloh yo‘q. Sen meni yaratding, men Sening bandangman va imkonim boricha ahdu va’dangda turibman. Qilgan yomonliklarimdan Sendan panoh so‘rayman. Menga bergan ne’matingni tan olaman va gunohimni tan olaman. Meni kechir, chunki gunohlarni Sendan o‘zga hech kim kechira olmaydi."}, {"id": "hs", "c": ["sb", "sh"], "k": 7, "t": "Hasbiyallohu", "ar": "حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ ۖ عَلَيْهِ تَوَكَّلْتُ ۖ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", "tr": "Hasbiyallohu la ilaha illa huva ‘alayhi tavakkaltu va huva Rabbul-‘arshil-‘azim.", "uz": "Menga Alloh yetarlidir, Undan o‘zga iloh yo‘q. Faqat Unga tavakkul qildim, U ulug‘ Arsh Rabbidir. (Tavba, 129)"}, {"id": "bz", "c": ["sb", "sh"], "k": 3, "t": "Zarar yetmaslik duosi", "ar": "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", "tr": "Bismillahillazi la yadurru ma‘asmihi shay’un fil-arzi va la fis-sama’i va huvas-sami‘ul-‘alim.", "uz": "Ismi bilan boshlaganda yerda ham, osmonda ham hech narsa zarar yetkaza olmaydigan Alloh nomi bilan. U eshituvchi va biluvchidir."}, {"id": "sv", "c": ["sb", "sh"], "k": 100, "t": "Subhanalloh va bihamdih", "ar": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", "tr": "Subhanallohi va bihamdih.", "uz": "Allohni poklayman va Unga hamd aytaman."}, {"id": "tl", "c": ["sb"], "k": 10, "t": "Tahlil", "ar": "لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "tr": "La ilaha illallohu vahdahu la sharika lah, lahul-mulku va lahul-hamdu va huva ‘ala kulli shay’in qadir.", "uz": "Allohdan o‘zga iloh yo‘q, U yagonadir, sherigi yo‘q. Mulk Unikidir, hamd Unga xosdir va U hamma narsaga qodirdir."}, {"id": "n1", "c": ["nm"], "k": 3, "t": "Istig‘for", "ar": "أَسْتَغْفِرُ اللَّهَ", "tr": "Astag‘firulloh.", "uz": "Allohdan mag‘firat so‘rayman."}, {"id": "n2", "c": ["nm"], "k": 1, "t": "Allohumma antas-salam", "ar": "اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ", "tr": "Allohumma antas-salam va minkas-salam, tabarakta ya zal-jalali val-ikram.", "uz": "Ey Alloh, Sen Salomsan (aybu nuqsondan xolisan), salomatlik Sendandir. Ey ulug‘lik va ikrom egasi, Sen barakotlisan."}, {"id": "n3", "c": ["nm"], "k": 33, "t": "Subhanalloh", "ar": "سُبْحَانَ اللَّهِ", "tr": "Subhanalloh.", "uz": "Alloh pokdir (har qanday nuqsondan)."}, {"id": "n4", "c": ["nm"], "k": 33, "t": "Alhamdulillah", "ar": "الْحَمْدُ لِلَّهِ", "tr": "Alhamdulillah.", "uz": "Hamd Allohgadir."}, {"id": "n5", "c": ["nm"], "k": 33, "t": "Allohu akbar", "ar": "اللَّهُ أَكْبَرُ", "tr": "Allohu akbar.", "uz": "Alloh ulug‘dir."}, {"id": "n6", "c": ["nm"], "k": 1, "t": "Tahlil bilan yuzni to‘ldirish", "ar": "لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "tr": "La ilaha illallohu vahdahu la sharika lah, lahul-mulku va lahul-hamdu va huva ‘ala kulli shay’in qadir.", "uz": "Allohdan o‘zga iloh yo‘q, U yagonadir, sherigi yo‘q. Mulk Unikidir, hamd Unga xosdir va U hamma narsaga qodirdir."}, {"id": "u1", "c": ["uy"], "k": 1, "t": "Uxlashdan oldin", "ar": "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", "tr": "Bismika Allohumma amutu va ahya.", "uz": "Ey Alloh, Sening noming bilan o‘laman va tirilaman."}, {"id": "u2", "c": ["uy"], "k": 33, "t": "Subhanalloh (uyqudan oldin)", "ar": "سُبْحَانَ اللَّهِ", "tr": "Subhanalloh.", "uz": "Alloh pokdir."}, {"id": "u3", "c": ["uy"], "k": 33, "t": "Alhamdulillah (uyqudan oldin)", "ar": "الْحَمْدُ لِلَّهِ", "tr": "Alhamdulillah.", "uz": "Hamd Allohgadir."}, {"id": "u4", "c": ["uy"], "k": 34, "t": "Allohu akbar (uyqudan oldin)", "ar": "اللَّهُ أَكْبَرُ", "tr": "Allohu akbar.", "uz": "Alloh ulug‘dir."}, {"id": "k1", "c": ["kn"], "k": 1, "t": "Uyg‘onganda", "ar": "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", "tr": "Alhamdu lillahil-lazi ahyana ba‘da ma amatana va ilayhin-nushur.", "uz": "Bizni o‘ldirgandan keyin tiriltirgan Allohga hamd bo‘lsin, qaytish ham Unga."}, {"id": "k2", "c": ["kn"], "k": 1, "t": "Ovqatdan oldin", "ar": "بِسْمِ اللَّهِ", "tr": "Bismillah.", "uz": "Alloh nomi bilan. (Boshida unutsang: “Bismillahi avvalahu va axirah”.)"}, {"id": "k3", "c": ["kn"], "k": 1, "t": "Ovqatdan keyin", "ar": "الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَٰذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ", "tr": "Alhamdu lillahil-lazi at‘amani haza va razaqanihi min g‘ayri havlin minni va la quvva.", "uz": "Menga buni yedirgan va men hech kuch-quvvatsiz bo‘lgan holda rizq qilib bergan Allohga hamd bo‘lsin."}, {"id": "k4", "c": ["kn"], "k": 1, "t": "Uydan chiqayotganda", "ar": "بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى اللَّهِ، وَلَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللَّهِ", "tr": "Bismillahi tavakkaltu ‘alallohi va la havla va la quvvata illa billah.", "uz": "Alloh nomi bilan, Allohga tavakkul qildim. Kuch va quvvat faqat Alloh bilandir."}, {"id": "k5", "c": ["kn"], "k": 1, "t": "Uyga kirayotganda", "ar": "بِسْمِ اللَّهِ وَلَجْنَا، وَبِسْمِ اللَّهِ خَرَجْنَا، وَعَلَىٰ رَبِّنَا تَوَكَّلْنَا", "tr": "Bismillahi valajna va bismillahi xarajna va ‘ala Rabbina tavakkalna.", "uz": "Alloh nomi bilan kirdik, Alloh nomi bilan chiqdik va Rabbimizga tavakkul qildik."}, {"id": "k6", "c": ["kn"], "k": 1, "t": "Masjidga kirganda", "ar": "اللَّهُمَّ افْتَحْ لِي أَبْوَابَ رَحْمَتِكَ", "tr": "Allohummaftah li abvaba rahmatik.", "uz": "Ey Alloh, menga rahmating eshiklarini och."}, {"id": "k7", "c": ["kn"], "k": 1, "t": "Masjiddan chiqqanda", "ar": "اللَّهُمَّ إِنِّي أَسْأَلُكَ مِنْ فَضْلِكَ", "tr": "Allohumma inni as’aluka min fadlik.", "uz": "Ey Alloh, Sendan fazlingni so‘rayman."}, {"id": "k8", "c": ["kn"], "k": 1, "t": "Safar duosi (Zuxruf, 13-14)", "ar": "سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَٰذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ وَإِنَّا إِلَىٰ رَبِّنَا لَمُنْقَلِبُونَ", "tr": "Subhanallazi sahxara lana haza va ma kunna lahu muqrinin va inna ila Rabbina lamunqalibun.", "uz": "Buni bizga bo‘ysundirgan Zot pokdir, biz uni bo‘ysundirishga qodir emas edik. Albatta, biz Rabbimizga qaytuvchimiz."}, {"id": "k9", "c": ["kn"], "k": 100, "t": "Istig‘for", "ar": "أَسْتَغْفِرُ اللَّهَ وَأَتُوبُ إِلَيْهِ", "tr": "Astag‘firulloha va atubu ilayh.", "uz": "Allohdan mag‘firat so‘rayman va Unga tavba qilaman."}, {"id": "k10", "c": ["kn"], "k": 10, "t": "Salovat", "ar": "اللَّهُمَّ صَلِّ وَسَلِّمْ عَلَىٰ نَبِيِّنَا مُحَمَّدٍ", "tr": "Allohumma solli va sallim ‘ala nabiyyina Muhammad.", "uz": "Ey Alloh, payg‘ambarimiz Muhammadga salovat va salom yo‘lla."}, {"id": "k11", "c": ["kn"], "k": 1, "t": "G‘am va dangasalikdan panoh", "ar": "اللَّهُمَّ إِنِّي أَعُوذُ بِكَ مِنَ الْهَمِّ وَالْحَزَنِ، وَالْعَجْزِ وَالْكَسَلِ، وَالْبُ   ${HIST===null?'<button class="btn" style="width:100%" onclick="histLoad()">Zaxiralarni ko‘rsat</button>':HISTERR?`<p style="color:var(--bad);font-size:13px">Zaxira jadvali hali yoqilmagan (reliability.sql ishga tushirilmagan).</p>`:L||'<p class="mu">Hali zaxira yo‘q. Ma‘lumot o‘zgargach, birinchi zaxira paydo bo‘ladi.</p>'}
  ${lsGet('trk_prerestore')?'<button class="btn s" style="width:100%;margin-top:8px" onclick="histUndo()">Tiklashdan oldingi holatga qaytish</button>':''}`}
// ---- Xatolar paneli (faqat egasi uchun) ----
async function loadErrs(){const r=await sb.from('client_errors').select('*').order('created_at',{ascending:false}).limit(80);ERRL=r.error?[]:r.data;render()}
async function clearErrs(){if(!confirm('Hamma xatolar o‘chirilsinmi?'))return;await sb.from('client_errors').delete().neq('id',0);ERRL=[];render()}
function errCard(){if(!Array.isArray(OW))return '';const g={};(ERRL||[]).forEach(e=>{const k=e.msg;(g[k]=g[k]||{n:0,last:e.created_at,ver:e.ver,tab:e.tab,ua:e.ua,st:e.stack}).n++});
  const rows=Object.entries(g).sort((a,b)=>b[1].n-a[1].n).map(([m,x])=>`<div class="fbe"><b style="overflow-wrap:anywhere">${esc(m)}</b><div class="mu" style="font-size:12px">${x.n} marta · ${esc(x.tab||'')} · v${esc(x.ver||'')} · ${new Date(x.last).toLocaleString('sv').slice(0,16)}<br>${esc((x.ua||'').slice(0,70))}</div></div>`).join('');
  return `<p class="mu" style="margin:0 0 8px">Foydalanuvchilar telefonida chiqqan xatolar (guruhlangan).</p><div class="in"><button class="btn" style="flex:1" onclick="loadErrs()">Yuklash</button><button class="btn s" onclick="clearErrs()">Tozalash</button></div>${ERRL===null?'':rows||'<p class="mu">Xato yo‘q. 🎉</p>'}`}

// ---- Telegram bot: ulash, eslatmalar va pochta qutisi ----
let TGB='',TGL=null,TGW=false;
async function tgInit(){if(!sb||!UID)return;
  try{const c=await sb.from('app_config').select('value').eq('key','tg_bot').maybeSingle();TGB=(c.data&&c.data.value)||'';
    if(!TGB)return;const l=await sb.from('tg_links').select('chat_id').eq('user_id',UID).maybeSingle();if(l.error)return;
    const was=TGL;TGL=!!l.data;
    if(TGL&&!S.rem.tg){S.rem.tg=true;if(S.rem.nz===undefined)S.rem.nz=true;if(TGW)try{toast('Telegram ulandi ✅')}catch(e){}TGW=false;save();await syncRem(true)}
    else if(!TGL&&S.rem.tg){S.rem.tg=false;save();await syncRem(true)}
  }catch(e){}}
async function tgLink(){if(!TGB){alert('Telegram bot hali sozlanmagan.');return}
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',rnd=new Uint8Array(8);crypto.getRandomValues(rnd);let code='';rnd.forEach(x=>{code+=A[x%A.length]});
  const r=await sb.from('tg_codes').insert({code,user_id:UID,tz:-new Date().getTimezoneOffset(),expires_at:new Date(Date.now()+20*60000).toISOString()});
  if(r.error){alert('Kod yaratib bo‘lmadi: '+(r.error.message||r.error));return}
  TGW=true;window.open('https://t.me/'+TGB+'?start='+code,'_blank');render()}
async function tgUnlink(){if(!confirm('Telegram uzilsinmi? Eslatmalar botga kelmaydi.'))return;await sb.from('tg_links').delete().eq('user_id',UID);TGL=false;S.rem.tg=false;save();await syncRem(true)}
function rzForce(k,v){const R=S.rz,c=R.fast[k]||0;if(c===v)return;
  if(c===2){R.debt=Math.max(0,R.debt-1);const x=R.log.findIndex(y=>y.d===k&&y.k==='miss');if(x>=0)R.log.splice(x,1)}
  if(v===2){R.debt++;R.log.push({id:Date.now(),d:k,k:'miss',n:1})}R.fast[k]=v}
function nmOne(k,p){const N=S.nm,d=N.d[k]=N.d[k]||{},c=d[p]||0;if(c===1)return;
  if(c===2){N.debt[p]=Math.max(0,(N.debt[p]||0)-1);const i=N.log.findIndex(x=>x.d===k&&x.p===p&&x.k==='miss');if(i>=0)N.log.splice(i,1)}d[p]=1}
// Bot "pochta qutisi"ga yozadi, ilova ochilganda shu yerdan olib o‘z holatiga qo‘llaydi (sinxron bilan to‘qnashmaydi)
async function tgApply(){if(!sb||!UID||!TGL)return;
  try{const r=await sb.from('tg_inbox').select('*').eq('applied',false).order('id',{ascending:true}).limit(100);
    if(r.error||!r.data||!r.data.length)return;
    const done=new Set(S.tgd||[]),ids=[];let ch=false;
    for(const x of r.data){ids.push(x.id);if(done.has(x.id))continue;done.add(x.id);
      const p=x.payload||{},k=/^\d{4}-\d\d-\d\d$/.test(p.d||'')?p.d:dk();if(k>dk())continue;
      if(x.kind==='nm'&&['fajr','dhuhr','asr','maghrib','isha','vitr'].includes(p.p)){nmOne(k,p.p);ch=true}
      else if(x.kind==='blk'&&/^[\w-]{1,40}$/.test(p.id||'')){(S.done[k]=S.done[k]||{})[p.id]=true;ch=true}
      else if(x.kind==='task'&&p.t){(S.tasks[k]=S.tasks[k]||[]).push({t:String(p.t).slice(0,200),x:0});ch=true}
      else if(x.kind==='zk'&&['sb','sh'].includes(p.c)){const D=S.dz.d[k]=S.dz.d[k]||{};dzList(p.c).forEach(d=>{D[d.id+'@'+p.c]=d.k});ch=true}
      else if(x.kind==='rz'&&(p.v===1||p.v===2)){rzForce(k,p.v);ch=true}
      else if(x.kind==='water'){S.water[k]=Math.max(0,Math.min(8,(S.water[k]||0)+(+p.n||1)));ch=true}}
    S.tgd=[...done].slice(-200);
    if(ch){save();try{toast('Telegramdagi belgilar qo‘llandi')}catch(e){}}else lsSet(KEY(),JSON.stringify(S))
    await sb.from('tg_inbox').delete().in('id',ids)
  }catch(e){}}
async function tgSync(){await tgInit();await tgApply()}
function tgBlock(){if(!TGB)return '';
  if(TGL)return `<div class="goal" style="padding:12px 14px;border-left:4px solid var(--ac);margin-bottom:8px"><b>✈️ Telegram ulangan ✅</b><p class="mu" style="margin:6px 0 8px">Eslatmalar botga keladi, tugma bosib belgilaysan. Buyruqlar: /bugun, /vazifa, /suv, /yordam.</p><button class="btn s" onclick="tgUnlink()">Uzish</button></div>`;
  return `<div class="goal" style="padding:12px 14px;margin-bottom:8px"><b>✈️ Telegram orqali eslatma</b><p class="mu" style="margin:6px 0 8px">Eslatmalar Telegram’ga keladi va tugma bilan belgilaysan. Bildirishnomadan ishonchliroq.</p><button class="big" style="margin:0" onclick="tgLink()">${TGW?'Telegramda “Start” ni bos, keyin shu yerga qayt':'Telegramga ulash'}</button></div>`}

async function fn(body){const r=await sb.functions.invoke('create-user',{body});
  if(!r.error)return r.data;
  try{return await r.error.context.json()}catch(e){return{error:'Funksiya topilmadi yoki ishlamadi'}}}
let OS='7',OA='',OST=null,PROF=null;
async function loadOw(){const d=await fn({action:'list'});OW=d&&d.users?d.users:false;OST=d&&d.stats||null;render()}
function genP(){const c='abcdefghjkmnpqrstuvwxyz23456789';OP=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>c[x%c.length]).join('');render()}
const ago=t=>{if(!t)return 'hali kirmagan';const m=Math.floor((Date.now()-new Date(t))/60000);return m<2?'hozirgina':m<60?m+' daqiqa oldin':m<1440?Math.floor(m/60)+' soat oldin':Math.floor(m/1440)+' kun oldin'};
async function ownAct(body){const d=await fn(body);OE=d&&d.error?d.error:'';await loadOw();return !OE}
async function mkU(){
  const l=OL.trim().toLowerCase();
  if(!/^[a-z0-9_.]{3,20}$/.test(l)||OP.length<6){OE='Login 3–20 ta lotin harf yoki raqam, parol kamida 6 belgi bo‘lsin.';return render()}
  if(await ownAct({action:'create',login:l,password:OP,name:ON.trim(),plan:+OS})){OC={login:l,pass:OP};OL=OP=ON='';render()}
}
async function ugr(id,days){if(await ownAct({action:'grant',id,days,amount:sfn(OA)}))OA=''}
function ubl(id,b){ownAct({action:'block',id,blocked:b})}
async function upw(id){const p=prompt('Yangi parol (kamida 6 belgi):');if(!p)return;if(p.length<6){alert('Parol kamida 6 belgi.');return}if(await ownAct({action:'setpass',id,password:p}))alert('Parol almashtirildi: '+p)}
function udl(id){if(confirm('Foydalanuvchi va uning hamma ma‘lumoti o‘chirilsinmi?'))ownAct({action:'delete',id})}
function cp(){const t='Kunlik tizim\nLink: '+location.origin+location.pathname+'\nLogin: '+OC.login+'\nParol: '+OC.pass;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{OC.copied=1;render()}).catch(()=>{prompt('Nusxalang:',t)})}
function stLine(u){const now=Date.now();
  if(u.blocked)return '<span style="color:var(--bad)">Bloklangan</span>';
  if(u.lifetime)return '<span style="color:var(--ac)">∞ Umrbod premium</span>';
  if(!u.expires_at||new Date(u.expires_at)<=now)return '<span style="color:var(--bad)">Obuna tugagan</span>';
  return `<span style="color:var(--ac)">Obuna: ${Math.ceil((new Date(u.expires_at)-now)/864e5)} kun qoldi (${u.expires_at.slice(0,10)})</span>`}
const hasPrem=u=>u.lifetime||(u.expires_at&&new Date(u.expires_at)>Date.now());
const revokeBtn=u=>hasPrem(u)&&!u.blocked?`<button class="ghost" style="margin-top:6px;color:var(--bad);border-color:var(--bad)" onclick="urv('${u.id}',${u.lifetime?1:0})">↩ ${u.lifetime?'Umrbod premiumni':'Premiumni'} qaytarib olish</button>`:'';
function urv(id,life){const d=prompt((life?'Umrbod premium qaytarib olinadi.':'Premium muddati qisqartiriladi.')+' Necha kun qolsin? (0 yozsang, darhol tugaydi)','0');if(d===null)return;
  const n=Math.max(0,parseInt(d,10)||0);if(!confirm(n?`Premium ${n} kundan keyin tugaydi. Davom etilsinmi?`:'Premium DARHOL tugaydi va foydalanuvchi kira olmaydi. Davom etilsinmi?'))return;
  ownAct({action:'revoke',id,days:n,amount:sfn(OA)}).then(r=>{if(r){OA='';render()}})}
function owner(){
  if(!Array.isArray(OW))return '';
  const s=OST||{month:0,prev:0,total:0},us=OW.map(u=>{const lg=(u.email||'').replace('@trk.app','');
    return `<div class="goal"><b>${esc(u.name||lg)}${u.me?' (siz)':''}</b><p class="mu" style="margin:2px 0">${esc(lg)}, oxirgi faollik: ${ago(u.last)}</p><p style="margin:0 0 ${u.me?0:8}px">${stLine(u)}</p>
    ${u.me?'':`<div class="ug"><button class="btn s" onclick="ugr('${u.id}',1)">+1</button><button class="btn s" onclick="ugr('${u.id}',7)">+7</button><button class="btn s" onclick="ugr('${u.id}',30)">+30</button><button class="btn s" onclick="ugr('${u.id}',-1)">∞</button><button class="btn s" onclick="ubl('${u.id}',${!u.blocked})">${u.blocked?'Ochish':'Blok'}</button></div><div class="in" style="margin:6px 0 0"><button class="btn s" style="flex:1" onclick="upw('${u.id}')">Parol</button><button class="btn s" style="flex:1" onclick="udl('${u.id}')">O‘chirish</button></div>${revokeBtn(u)}`}</div>`}).join('');
  const card=OC?`<div class="goal" style="border:1px solid var(--go)"><b>Tayyor. Yuborish uchun nusxala</b><p class="mu" style="margin:6px 0 10px">Login: ${esc(OC.login)}<br>Parol: ${esc(OC.pass)}</p><button class="btn" onclick="cp()">${OC.copied?'Nusxalandi':'Nusxalash'}</button></div>`:'';
  return `<h2>Foydalanuvchilar</h2><div class="st"><div><b style="font-size:15px">${num(s.month)}</b>bu oy, so‘m</div><div><b style="font-size:15px">${num(s.prev)}</b>o‘tgan oy</div><div><b style="font-size:15px">${num(s.total)}</b>jami</div></div>
  ${card}<div class="goal" style="margin-top:12px"><b>Yangi foydalanuvchi</b><div class="in" style="margin-top:10px"><input placeholder="Login (masalan: aziz01)" value="${esc(OL)}" oninput="OL=this.value" autocapitalize="none"></div><div class="in"><input placeholder="Parol (kamida 6 belgi)" value="${esc(OP)}" oninput="OP=this.value" autocapitalize="none"></div><button class="ghost" style="margin:0 0 8px" onclick="genP()">Parol yaratish</button><div class="in"><input placeholder="Ism (ixtiyoriy)" value="${esc(ON)}" oninput="ON=this.value"></div><div class="in"><select onchange="OS=this.value">${[['3','Sinov: 3 kun'],['7','Sinov: 7 kun'],['30','30 kun'],['-1','Umrbod premium']].map(x=>`<option value="${x[0]}" ${OS===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><p class="err">${esc(OE)}</p><button class="big" style="margin:0" onclick="mkU()">Foydalanuvchi qo‘shish</button></div>
  <h2>Obuna berish</h2><div class="in"><input type="text" inputmode="numeric" placeholder="To‘lov summasi, so‘m (sovg‘a bo‘lsa bo‘sh qoldir)" value="${esc(OA)}" oninput="OA=this.value"></div><p class="mu" style="margin:0 0 8px">Pastdagi +1, +7, +30 yoki ∞ tugmasini bossang, shu summa to‘lov sifatida yoziladi. Premiumni qaytarib olayotganda summa yozilgan bo‘lsa, u qaytarilgan pul sifatida hisobdan ayriladi.</p>${us}`;
}

// ---- Obuna va bloklash ----
async function loadProf(){
  if(!sb||!UID)return;
  try{const r=await sb.from('profiles').select('*').eq('user_id',UID).maybeSingle();if(!r.error){PROF=r.data||null;try{localStorage.setItem('trk_prof',JSON.stringify(PROF))}catch(e){}}}catch(e){}
  if(!PROF){try{PROF=JSON.parse(localStorage.getItem('trk_prof')||'null')}catch(e){}}}
const lockMsg=()=>{const p=PROF;if(!p)return '';if(p.blocked)return 'Hisobingiz bloklangan. Egasi bilan bog‘laning.';if(!p.lifetime&&(!p.expires_at||new Date(p.expires_at)<=new Date()))return 'Obuna muddati tugagan. Davom etish uchun egasi bilan bog‘laning.';return ''};
const subDays=()=>PROF&&!PROF.lifetime&&PROF.expires_at?Math.ceil((new Date(PROF.expires_at)-Date.now())/864e5):null;
const subLine=()=>!PROF?'':PROF.lifetime?'∞ Umrbod premium':'Obuna: '+subDays()+' kun qoldi ('+PROF.expires_at.slice(0,10)+')';
const subChip=()=>{const d=subDays();return d!==null&&d<=3&&d>0?` <span class="chip bad">obuna ${d} kun qoldi</span>`:''};
async function recheck(){await loadProf();if(!lockMsg())await pull();render()}
function lockView(){return `<div class="auth"><img src="favicon.svg" width="64" height="64" alt="" style="border-radius:16px;margin-bottom:16px"><h1>Kirish cheklangan</h1>${brand()}<p class="mu">${lockMsg()}</p>${tgBtn('Obuna olish: Telegram’da yozish')}<button class="ghost" onclick="recheck()">Qayta tekshirish</button><button class="ghost" onclick="out()">Chiqish</button></div>`}
async function out(){try{await sb.auth.signOut()}catch(e){}try{localStorage.removeItem('trk_uid')}catch(e){}UID=null;OW=null;OC=null;PROF=null;S=blank();render()}
function err(t){const e=$('#er');if(e)e.textContent=t}
async function auth(up){
  const l=$('#lg').value.trim().toLowerCase(),p=$('#pw').value;
  if(!l.includes('@')&&!/^[a-z0-9_.]{3,20}$/.test(l))return err('Login 3–20 ta lotin harf yoki raqamdan iborat bo‘lsin.');
  if(p.length<6)return err('Parol kamida 6 belgidan iborat bo‘lsin.');
  const c={email:l.includes('@')?l:l+'@trk.app',password:p};
  const r=up?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);
  if(r.error)return err(/invalid/i.test(r.error.message)?'Login yoki parol noto‘g‘ri.':r.error.message);
    await start(r.data.session.user.id,r.data.session.user.email);
}
async function start(id,em){UID=id;REV=(()=>{const v=lsGet('trk_rev_'+id);return v==null?null:+v})();ensurePersist();try{localStorage.setItem('trk_uid',id);if(em)localStorage.setItem('trk_em',em)}catch(e){}S=load();await loadProf();if(!lockMsg()){await pull();if(S.ts&&!S.sg)sgMig();await tgSync();try{if(localStorage.getItem('trk_dirty'))push()}catch(e){}}render()}
(async()=>{
  if(!sb){S=load();render();ptEnsure()}
  else{
    let ok=false;
    try{const r=await sb.auth.getSession();if(r.data&&r.data.session){ok=true;await start(r.data.session.user.id,r.data.session.user.email);ptEnsure()}}catch(e){}
    if(!ok){let u=null;try{u=localStorage.getItem('trk_uid')}catch(e){}if(u&&navigator.onLine===false)await start(u);else render()}
  }
  ['touchstart','touchmove','scroll'].forEach(ev=>window.addEventListener(ev,()=>{LT=Date.now()},{passive:true}));
  setInterval(()=>{ptEnsure();if(Date.now()-LT<3000)return;if(tab!=='h'&&tab!=='q')return;const a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))render()},30000);
  window.addEventListener('online',()=>{SYNC='ok';let d=null;try{d=localStorage.getItem('trk_dirty')}catch(e){}if(d)push();else pull().then(c=>{if(c)render()});tgSync();render()});
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&sb&&UID&&Date.now()-LPL>20000){LPL=Date.now();pull().then(c=>{if(c)render();tgSync()})}});
  window.addEventListener('offline',()=>{SYNC='off';render()});
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
