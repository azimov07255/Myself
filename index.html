<style>
:root{--bg:#0a1a2c;--c1:#112640;--c2:#183456;--tx:#e9eef2;--mu:#8fa6ba;--ac:#46c4b2;--go:#e2b857;--ln:#23415f;--bad:#e5766b;--on-ac:#08202a;--on-go:#14202c;--hbg:#112640;--htx:#e9eef2;--hmu:#8fa6ba;--hlab:#46c4b2;--hp:rgba(70,196,178,.07);color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#f8f4ea;--c1:#fffdf8;--c2:#efe9db;--tx:#1b2a22;--mu:#68786d;--ac:#17604a;--go:#d9703d;--ln:#e5dfcf;--bad:#c0503f;--on-ac:#fff;--on-go:#fff;--hbg:#17604a;--htx:#f7f3e8;--hmu:#bcd6c8;--hlab:#f4b98f;--hp:rgba(255,255,255,.05);color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 Figtree,system-ui,sans-serif}
#app{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 96px)}
h1,h2{font-family:Fraunces,Figtree,system-ui,sans-serif;margin:0}
h2{font-size:18px;margin:26px 0 10px}
.top{display:flex;justify-content:space-between;align-items:center}
.top p{margin:0}.top .d{font-family:Fraunces,system-ui;font-size:22px;font-weight:600}
.mu{color:var(--mu);font-size:14px}
.hero{margin-top:16px;padding:22px 20px;border-radius:24px;border:1px solid var(--ln);background:var(--hbg) repeating-conic-gradient(from 45deg,transparent 0 25%,var(--hp) 0 50%) 0 0/30px 30px;color:var(--htx)}.hero .lab{color:var(--hlab)}.hero .mu{color:var(--hmu)}.hero .bar{background:rgba(128,128,128,.25)}.hero .bar i{background:var(--hlab)}.hero .big.ok{background:rgba(128,128,128,.25);color:var(--htx)}
.hero .lab{margin:0;font-weight:600}
.hero h1{font-size:clamp(34px,10vw,46px);line-height:1.05;font-weight:800;margin:6px 0 10px}
.hero p{margin:0 0 4px}
.big{width:100%;margin-top:16px;padding:15px;border:0;border-radius:16px;background:var(--go);color:var(--on-go);font:600 17px Figtree,system-ui}
.big.ok{background:var(--c2);color:var(--ac)}
.ghost{width:100%;margin-top:12px;padding:12px;border-radius:14px;border:1px dashed var(--ln);background:none;color:var(--tx);font:600 15px Figtree,system-ui}
.row{display:flex;align-items:center;gap:12px;padding:12px 12px;border-radius:14px;background:var(--c1);margin-bottom:6px;border-left:3px solid transparent;width:100%;text-align:left;color:var(--tx);border-top:0;border-right:0;border-bottom:0;font:inherit}
.row.now{border-left-color:var(--go);background:var(--c2)}
.row.done .t{text-decoration:line-through;color:var(--mu)}
.row .t{flex:1}.row .tm{color:var(--mu);font-size:13px;white-space:nowrap}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--mu);flex:none;display:grid;place-items:center;font-size:13px;color:var(--on-ac)}
.done .ck{background:var(--ac);border-color:var(--ac)}
.in{display:flex;gap:8px;margin-bottom:8px}
input,.seg button{font:inherit}
input[type=text],input[type=password],input[type=number],input:not([type]){flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--c1);color:var(--tx)}
.btn{padding:12px 16px;border:0;border-radius:12px;background:var(--ac);color:var(--on-ac);font-weight:600}
.btn.s{background:var(--c2);color:var(--tx)}
.seg{display:flex;background:var(--c1);border-radius:12px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;padding:9px;border-radius:10px;background:none;color:var(--mu);font-weight:600}
.seg button.on{background:var(--c2);color:var(--tx)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sum div{background:var(--c1);border-radius:14px;padding:12px}
.sum b{display:block;font-size:19px;font-family:Fraunces,system-ui}
.sum .w{grid-column:1/3;border:1px solid var(--go)}
.in-c{color:var(--ac)}.out-c{color:var(--bad)}
.x{border:0;background:none;color:var(--mu);font-size:20px;padding:0 4px}
.goal{background:var(--c1);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.goal .h{display:flex;justify-content:space-between;gap:8px}
input[type=range]{width:100%;accent-color:var(--ac);margin:10px 0 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;background:var(--bg);border-top:1px solid var(--ln);padding:6px 12px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav div{display:flex;width:100%;max-width:480px;gap:6px}
nav button{flex:1;padding:12px 0;border:0;border-radius:12px;background:none;color:var(--mu);font:600 15px Figtree,system-ui}
nav button.on{background:var(--c1);color:var(--go)}
.auth{margin-top:12vh}.auth h1{font-size:40px;font-weight:800;margin-bottom:6px}
.err{color:var(--bad);min-height:22px;margin:8px 0}
.bar{height:8px;border-radius:6px;background:var(--c2);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
input[type=time]{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--c1);color:var(--tx)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.chips button{padding:8px 12px;border-radius:20px;border:1px solid var(--ln);background:none;color:var(--mu);font:600 14px Figtree,system-ui}.chips .on{background:var(--c2);color:var(--tx);border-color:var(--ac)}
.tsb{width:230px;height:230px;border-radius:50%;border:0;margin:16px auto;display:grid;place-items:center;padding:0}.tsb span{width:196px;height:196px;border-radius:50%;background:var(--c1);display:grid;place-items:center;font:800 64px Fraunces,system-ui;color:var(--tx)}
.bar{height:8px;border-radius:6px;background:var(--c2);overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);transition:width .6s}
input[type=date],select{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--c1);color:var(--tx);font:inherit;width:100%}
textarea{width:100%;min-height:90px;padding:12px 14px;border-radius:12px;border:1px solid var(--ln);background:var(--c1);color:var(--tx);font:inherit;resize:vertical}
.gr{font-size:28px;font-weight:800;line-height:1.1;margin:4px 0 6px}.qt{font-style:italic;margin:0}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px}.wd{background:var(--c1);border:1px solid var(--ln);border-radius:14px;padding:8px 0;text-align:center;font-size:12px;color:var(--mu)}.wd b{display:block;font:700 18px Fraunces,serif;color:var(--tx)}.wd.on{background:var(--ac);border-color:var(--ac)}.wd.on,.wd.on b{color:var(--on-ac)}.dot{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0}.dot.y{background:var(--go)}.wd.on .dot.y{background:var(--on-ac)}
.hg{overflow-x:auto;margin:0 -16px;padding:0 16px}table{border-collapse:collapse}th,td{padding:3px;font-size:12px;color:var(--mu);font-weight:400}th.td{color:var(--go);font-weight:700}.sk{position:sticky;left:0;background:var(--bg);text-align:left;min-width:118px;color:var(--tx);font-size:14px;z-index:1}
.cell{width:26px;height:26px;border-radius:50%;border:1px solid var(--ln);background:var(--c1);padding:0}.cell.on{background:var(--ac);border-color:var(--ac)}.cell:disabled{opacity:.35}
.mood{display:flex;justify-content:space-between}.mood button{font-size:26px;background:none;border:2px solid transparent;border-radius:50%;padding:4px;opacity:.55}.mood .on{opacity:1;border-color:var(--go)}
.gl{width:28px;height:34px;border-radius:6px 6px 12px 12px;border:2px solid var(--ln);background:none;padding:0}.gl.on{background:var(--ac);border-color:var(--ac)}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes grow{from{width:0}}
.anim>:not(nav){animation:fu .5s both}.anim>:nth-child(2){animation-delay:.05s}.anim>:nth-child(3){animation-delay:.1s}.anim>:nth-child(4){animation-delay:.15s}.anim .bar i{animation:grow .9s ease-out}
button{transition:transform .12s,background .2s}button:active{transform:scale(.97)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Supabase kalitini shu yerga qo‘ying (Project Settings → API → anon public key)
const CFG={url:'https://dsfwagfsehpugjkervqc.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRzZndhZ2ZzZWhwdWdqa2VydnFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MjcwNTksImV4cCI6MjEwODMwMzA1OX0.-fUlJz-VU3Y3_PkpfHsbFkCFsRTCBeJJ5qXs-ZiAMq8'};
const sb=(CFG.key&&window.supabase)?supabase.createClient(CFG.url,CFG.key):null;

const DAYS=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
const MON=['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentabr','oktyabr','noyabr','dekabr'];
const M=(h,m=0)=>h*60+m;
const ALL=[0,1,2,3,4,5,6],WD=[1,2,3,4,5],GYM=[1,3,5,6],NG=[0,2,4];
// Jadval: s/e daqiqada, e>1440 bo‘lsa yarim tundan o‘tadi. Hamma narsa shu yerda o‘zgartiriladi.
const BL=[
{id:'uyg',t:'Uyg‘onish',n:'Tur, tahorat, namoz, suv ich.',s:M(5),e:M(6),d:ALL},
{id:'qur',t:'Qur‘on',n:'3 bet yodlash, takror, kunlik hatm.',s:M(6),e:M(9),d:ALL},
{id:'dok',t:'Dokon',n:'Mijoz kam paytda IELTS listening va lug‘at.',s:M(9),e:M(17),d:ALL},
{id:'yol',t:'Yo‘l va ovqat',n:'Univerga tayyorlan.',s:M(17),e:M(18),d:WD},
{id:'uni',t:'Univer',n:'Darsda to‘liq qatnash.',s:M(18),e:M(20,50),d:WD},
{id:'dam',t:'Ovqat va dam',n:'Yengil ovqat, 20 daqiqa dam.',s:M(20,50),e:M(21,15),d:WD},
{id:'iel',t:'IELTS',n:'Reading yoki writing mashqi.',s:M(21,15),e:M(22),d:WD},
{id:'zal',t:'Zal',n:'Mashq, cho‘zilish, suv.',s:M(22),e:M(24),d:GYM},
{id:'mol',t:'Pul hisobi va ertangi reja',n:'Kirim-chiqimni yoz, ertangi 3 ta ishni belgila.',s:M(22),e:M(22,45),d:[2,4]},
{id:'hft',t:'Haftalik tahlil',n:'Haftani ko‘rib chiq, keyingi haftani rejala.',s:M(18),e:M(19),d:[0]},
{id:'uyqu1',t:'Uxlash',n:'Telefon chetga. Ertaga 05:00.',s:M(23),e:M(29),d:NG},
{id:'uyqu2',t:'Uxlash',n:'Telefon chetga. Ertaga 05:00.',s:M(24),e:M(29),d:GYM}
];
const RULES=[{id:'ig',t:'Instagramsiz kun'},{id:'ph',t:'Yotishdan oldin 30 daqiqa telefonsiz'},{id:'sl',t:'Rejadagi vaqtda uxlashga yotdim'}];
const GOALS=['Hofizi Qur‘on bo‘lish','IELTS 8–9 ball','O‘qituvchi bo‘lib ishlash','Prava olish','Zalda yaxshi tana qurish'];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hm=m=>pad(Math.floor(m/60)%24)+':'+pad(m%60);
const dk=()=>new Date().toLocaleDateString('sv');
const fmt=m=>m>=60?Math.floor(m/60)+' soat '+(m%60?m%60+' daqiqa':''):m+' daqiqa';
const num=n=>Number(n).toLocaleString('ru-RU');
const blank=()=>({ts:0,done:{},tasks:{},rules:{},wake:{},goals:GOALS.map(t=>({t,p:0})),money:[],name:'',hab:[],hb:{},mood:{},water:{},note:{},fm:{},bl:null,wk:{base:0,start:null},q:{ppd:3,cur:0,m:{},ord:[],rv:0,rg:5,rd:{},hp:0,hg:20,hc:0,hd:{}},z:{sel:0,c:{}}});

let HMo=0,YS=-1,YA=1,YB=3,LJ=false,FL=25,FE=0,FS=1500,FR=null;
let QT='y',LO=false,ED=null,ALLV=false;
let OW=null,OL='',OP='',ON='',OE='',OC=null;
let S=blank(),UID=null,tab='h',W='p',K='out',FA='',FN='',tm=null;
const KEY=()=>'trk_'+(UID||'local');
function load(){try{return Object.assign(blank(),JSON.parse(localStorage.getItem(KEY())||'{}'))}catch(e){return blank()}}
function save(){S.ts=Date.now();try{localStorage.setItem(KEY(),JSON.stringify(S))}catch(e){}clearTimeout(tm);tm=setTimeout(push,700);render()}
async function push(){if(sb&&UID)try{await sb.from('app_state').upsert({user_id:UID,data:S,updated_at:new Date().toISOString()})}catch(e){}}
async function pull(){if(!sb||!UID)return;try{const r=await sb.from('app_state').select('data').eq('user_id',UID).maybeSingle();const d=r.data&&r.data.data;if(d&&(d.ts||0)>(S.ts||0))S=Object.assign(blank(),d);else if(S.ts)push()}catch(e){}}

function nowInfo(){
  const d=new Date(),n=d.getHours()*60+d.getMinutes(),today=bl().filter(b=>b.d.includes(d.getDay()));
  for(const b of today){
    if(n>=b.s&&n<b.e)return{b,nn:n};
    if(n+1440>=b.s&&n+1440<b.e)return{b,nn:n+1440};
  }
  return{nx:today.filter(b=>b.s>n).sort((a,c)=>a.s-c.s)[0],n};
}

const QUOTES=['Ilm olish — beshikdan qabrgacha.','Kichik qadamlar har kuni, katta natija har yili.','Bugungi ish ertaga qolmasin.','Sabr bilan qilingan mehnat so‘nmaydi.','Vaqt — eng qimmat omonat.'];
function scoreOf(k){const day=new Date(k+'T12:00').getDay(),dn=S.done[k]||{},rd=S.rules[k]||{},hb=S.hb[k]||{},tk_=S.tasks[k]||[];
  const c=bl().filter(b=>b.d.includes(day)&&!b.id.startsWith('uyqu')),tot=c.length+RULES.length+S.hab.length+tk_.length;
  const got=c.filter(b=>dn[b.id]).length+RULES.filter(r=>rd[r.id]).length+S.hab.filter(h=>hb[h.id]).length+tk_.filter(t=>t.x).length;
  return{tot,got,p:tot?Math.round(got/tot*100):0}}
function hozir(){
  const k=dk(),dn=S.done[k]||{},rd=S.rules[k]||{},hb=S.hb[k]||{},tasks=S.tasks[k]||[],d=new Date(),I=nowInfo(),day=d.getDay();
  const all=bl().map((b,i)=>({b,i})),td=all.filter(x=>x.b.d.includes(day)).sort((a,c)=>a.b.s-c.b.s),list=ALLV?all.slice().sort((a,c)=>a.b.s-c.b.s):td;
  const{tot,got,p:sc}=scoreOf(k),C=2*Math.PI*20,hr=d.getHours();
  let hero;
  if(I.b){const b=I.b,sl=b.id.startsWith('uyqu');
    hero=`<section class="hero"><p class="lab">Hozir</p><h1>${esc(b.t)}</h1><p>${hm(b.s)} dan ${hm(b.e)} gacha</p><p class="mu">${fmt(b.e-I.nn)} qoldi. ${esc(b.n||'')}</p>${sl?'':`<button class="big ${dn[b.id]?'ok':''}" onclick="tg('${b.id}')">${dn[b.id]?'Bajarildi':'Bajardim'}</button>`}</section>`;
  }else hero=`<section class="hero"><p class="lab">Hozir</p><h1>Bo‘sh vaqt</h1><p class="mu">${I.nx?`Keyingisi: ${esc(I.nx.t)}, ${hm(I.nx.s)} da.`:'Bugungi jadval tugadi.'}</p></section>`;
  const rows=list.map(({b,i})=>{const cur=I.b&&I.b.id===b.id,x=dn[b.id];
    return `<div class="row ${cur?'now':''} ${x?'done':''}"><span class="ck" onclick="tg('${b.id}')">${x?'✓':''}</span><span class="t" onclick="tg('${b.id}')">${esc(b.t)}${ALLV?`<br><span class="mu">${b.d.length===7?'Har kuni':b.d.map(j=>DAYS[j].slice(0,2)).join(' ')}</span>`:''}</span><span class="tm">${hm(b.s)}</span><button class="x" onclick="eb(${i})">✎</button></div>`}).join('');
  const chk=(on,fn,t)=>`<button class="row ${on?'done':''}" onclick="${fn}"><span class="ck">${on?'✓':''}</span><span class="t">${esc(t)}</span></button>`;
  const hh=S.hab.length?S.hab.map(h=>chk(hb[h.id],`hbT('${h.id}')`,h.t)).join(''):'<p class="mu">Odatlar bo‘limida o‘z odatlaringni yoz, ular shu yerda ko‘rinadi.</p>';
  const rr=RULES.map(r=>chk(rd[r.id],`rl('${r.id}')`,r.t)).join('');
  const tt=tasks.map((t,i)=>`<div class="row ${t.x?'done':''}"><span class="ck" onclick="tk(${i})">${t.x?'✓':''}</span><span class="t" onclick="tk(${i})">${esc(t.t)}</span><button class="x" onclick="dt(${i})">×</button></div>`).join('');
  const wd=(d.getDay()+6)%7,wk=[...Array(7)].map((_,i)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()-wd+i),kk=x.toLocaleDateString('sv');return `<div class="wd ${kk===k?'on':''}"><span>${DAYS[x.getDay()].slice(0,2)}</span><b>${x.getDate()}</b><i class="dot ${scoreOf(kk).p>0?'y':''}"></i></div>`}).join('');
  const mv=S.mood[k]||0,wt_=S.water[k]||0,fm=S.fm[k]||0,left=Math.max(0,FR?Math.ceil((FE-Date.now())/1000):FS);
  const faces=['😞','🙁','😐','🙂','😄'].map((f,i)=>`<button class="${mv===i+1?'on':''}" onclick="S.mood[dk()]=${i+1};save()">${f}</button>`).join('');
  const gls=[...Array(8)].map((_,i)=>`<button class="gl ${i<wt_?'on':''}" onclick="wt(${i<wt_?i:i+1})"></button>`).join('');
  let avg=0;const bars=[...Array(14)].map((_,i)=>{const kk=dAgo(13-i),p=scoreOf(kk).p;avg+=p;return `<div style="flex:1;text-align:center"><div style="height:80px;display:flex;align-items:flex-end"><div style="width:100%;height:${Math.max(4,p*.8)}px;background:${i===13?'var(--go)':'var(--ac)'};opacity:${i===13?1:.7};border-radius:4px"></div></div><span class="mu" style="font-size:11px">${DAYS[new Date(kk+'T12:00').getDay()].slice(0,2)}</span></div>`}).join('');
  return `<div class="top"><div><p class="mu" style="margin:0">${d.getDate()} ${MON[d.getMonth()]}, ${DAYS[d.getDay()]}</p><h1 class="gr">${hr<12?'Xayrli tong':hr<18?'Xayrli kun':'Xayrli kech'}${S.name?', '+esc(S.name):''}</h1><p class="mu qt">“${QUOTES[Math.floor(Date.now()/864e5)%QUOTES.length]}”</p></div>
  <svg width="64" height="64" viewBox="0 0 48 48"><circle cx="24" cy="24" r="20" fill="none" stroke="var(--c2)" stroke-width="5"/><circle cx="24" cy="24" r="20" fill="none" stroke="var(--ac)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C*sc/100} ${C}" transform="rotate(-90 24 24)"/><text x="24" y="28" text-anchor="middle" font-size="12" font-weight="700" fill="var(--tx)">${sc}%</text></svg></div>
  <div class="wk">${wk}</div>${edForm()}${hero}${wakeC()}
  <h2>${ALLV?'Barcha rejalar':'Bugungi jadval'}</h2>${rows}
  <div class="in"><button class="btn s" onclick="eb(-1)">Reja qo‘shish</button><button class="btn s" onclick="ALLV=!ALLV;render()">${ALLV?'Faqat bugun':'Barcha rejalar'}</button></div>

const SN="Fotiha,Baqara,Oli Imron,Niso,Moida,An’om,A’rof,Anfol,Tavba,Yunus,Hud,Yusuf,Ra’d,Ibrohim,Hijr,Nahl,Isro,Kahf,Maryam,Toho,Anbiyo,Haj,Mu’minun,Nur,Furqon,Shuaro,Naml,Qasas,Ankabut,Rum,Luqmon,Sajda,Ahzob,Saba,Fotir,Yosin,Soffot,Sod,Zumar,G’ofir,Fussilat,Shuro,Zuxruf,Duxon,Josiya,Ahqof,Muhammad,Fath,Hujurot,Qof,Zoriyot,Tur,Najm,Qamar,Rahmon,Voqe’a,Hadid,Mujodala,Hashr,Mumtahana,Saff,Jum’a,Munofiqun,Tag’obun,Taloq,Tahrim,Mulk,Qalam,Haqqa,Ma’orij,Nuh,Jin,Muzzammil,Muddassir,Qiyoma,Inson,Mursalot,Naba’,Nozi’ot,Abasa,Takvir,Infitor,Mutaffifin,Inshiqoq,Buruj,Toriq,A’lo,G’oshiya,Fajr,Balad,Shams,Layl,Zuho,Sharh,Tin,Alaq,Qadr,Bayyina,Zilzol,Odiyot,Qori’a,Takasur,Asr,Humaza,Fil,Quraysh,Mo’un,Kavsar,Kofirun,Nasr,Masad,Ixlos,Falaq,Nos".split(',');

function setM(i,v){const q=S.q,o=q.m[i]||0;v=Math.max(0,Math.min(SL(i),v));q.m[i]=v;if(o<=0&&v>0)q.ord.push(i);if(v<=0)q.ord=q.ord.filter(x=>x!==i);save()}
const sp=(i,d)=>setM(i,(S.q.m[i]||0)+d),sf=i=>setM(i,(S.q.m[i]||0)>=SL(i)?0:SL(i)),sc=i=>{S.q.cur=i;save()};
function addP(n){const q=S.q;let i=q.cur;while(n>0&&i<114){const a=Math.min(n,SL(i)-(q.m[i]||0));if(a>0){if(!(q.m[i]>0))q.ord.push(i);q.m[i]=(q.m[i]||0)+a;n-=a}if((q.m[i]||0)>=SL(i))i++;else break}q.cur=Math.min(i,113);save()}

const J=[1,22,42,62,82,102,121,142,162,182,201,222,242,262,282,302,322,342,362,382,402,422,442,462,482,502,522,542,562,582,605];
const AY=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,31,50,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,5,6];
function juzMem(j){let s=0;SN.forEach((_,i)=>{const d=Math.min(S.q.m[i]||0,SL(i));if(d>0){const a=SP[i];s+=Math.max(0,Math.min(a+d,J[j+1])-Math.max(a,J[j]))}});return s}
function ya(){const q=S.q,n=AY[YS<0?q.cur:YS],s=YS<0?q.cur:YS,a=Math.max(1,Math.min(n,+YA||1)),b=Math.max(a,Math.min(n,+YB||a));q.ty=q.ty||{};(q.ty[dk()]=q.ty[dk()]||[]).push({s,a,b,x:0});save()}

function yod(){
  const q=S.q,cs=q.cur,md=r1(mdone()),rem=TOT-md,days=Math.ceil(rem/q.ppd),fin=new Date(Date.now()+days*864e5);
  const st=SP[cs]+Math.floor(q.m[cs]||0),en=Math.min(st+q.ppd-1,cs<113?SP[cs+1]:604);
  const plan=SL(cs)<=1?`${SN[cs]} surasi`:`${SN[cs]}, ${st}–${en}-betlar`;
  const rows=SN.map((n,i)=>{const d=r1(q.m[i]||0),l=SL(i),f=d>=l;return `<div class="row ${f?'done':''} ${i===cs?'now':''}"><span class="ck" onclick="sf(${i})">${f?'✓':''}</span><span class="t" onclick="sc(${i})">${i+1}. ${n}<br><span class="mu">${SP[i]}-bet, ${AY[i]} oyat, ${d}/${l} bet</span></span><button class="x" onclick="sp(${i},-1)">−</button><button class="x" onclick="sp(${i},1)">+</button></div>`}).join('');
  const ty=(q.ty||{})[dk()]||[],ys=YS<0?cs:YS;
  const picks=ty.map((e,j)=>`<div class="row ${e.x?'done':''}"><span class="ck" onclick="yx(${j})">${e.x?'✓':''}</span><span class="t" onclick="yx(${j})">${SN[e.s]}, ${e.a}–${e.b}-oyatlar</span><button class="x" onclick="yd(${j})">×</button></div>`).join('');
  const opts=SN.map((n,i)=>`<option value="${i}" ${i===ys?'selected':''}>${i+1}. ${n} (${AY[i]} oyat)</option>`).join('');
  const jz=J.slice(0,30).map((s,j)=>{const l=J[j+1]-s,p=Math.min(100,Math.round(juzMem(j)/l*100));return `<div class="row"><span class="t">${j+1}-pora<br><span class="mu">${s}–${J[j+1]-1}-betlar</span><div class="bar" style="margin-top:4px"><i style="width:${p}%"></i></div></span><span class="mu" style="min-width:44px;text-align:right">${p}%</span></div>`}).join('');
  return `<section class="hero"><p class="lab">Bugungi yodlash</p><h1 style="font-size:28px">${plan}</h1><div class="bar" style="margin:10px 0"><i style="width:${md/TOT*100}%"></i></div><p class="mu">Yodlangan ${md} bet, qolgan taxminan ${Math.round(rem)} bet. Kuniga ${q.ppd} bet bilan ${days} kunda (${fin.getDate()} ${MON[fin.getMonth()]} ${fin.getFullYear()}) tugaydi.</p><p class="mu" style="margin-top:8px">Kunlik reja: ${q.ppd} bet</p>${stp('ppd',1)}<button class="big" style="margin-top:6px" onclick="addP(${q.ppd})">Bugun ${q.ppd} bet yodladim</button></section>
  <h2>Bugun yodlayotganlarim</h2><p class="mu" style="margin:0 0 8px">Sura va oyatlarni o‘zing tanla. Belgilasang, oyat ulushi sahifa hisobiga qo‘shiladi.</p>${picks}
  <div class="in"><select onchange="YS=+this.value;YA=1;YB=Math.min(AY[YS],3);render()">${opts}</select></div><div class="in"><input type="number" inputmode="numeric" placeholder="Oyatdan" value="${YA}" oninput="YA=this.value"><input type="number" inputmode="numeric" placeholder="Oyatgacha" value="${YB}" oninput="YB=this.value"><button class="btn" onclick="ya()">Qo‘sh</button></div>
  <h2>Suralar</h2><p class="mu" style="margin:0 0 8px">Nomini bossang, hozirgi sura bo‘ladi. Belgi bossang, to‘liq yodlangan bo‘ladi.</p><details ${LO?'open':''} ontoggle="LO=this.open"><summary class="mu" style="margin-bottom:8px">Barcha 114 sura</summary>${rows}</details>
  <h2>30 pora</h2><details ${LJ?'open':''} ontoggle="LJ=this.open"><summary class="mu" style="margin-bottom:8px">Pora bo‘yicha yodlash</summary>${jz}</details>`}
function tak(){
  const q=S.q,a=rvPlan(),k=dk(),pg=r1(a.reduce((s,i)=>s+Math.min(q.m[i]||0,SL(i)),0)),rest=q.ord.length-a.length;
  const list=q.ord.map(i=>`<div class="row ${a.includes(i)?'now':''}"><span class="t">${SN[i]}</span><span class="tm">${r1(Math.min(q.m[i],SL(i)))} bet</span></div>`).join('');
  return `<section class="hero"><p class="lab">Bugungi takror</p>${a.length?`<h1 style="font-size:26px">${a.map(i=>SN[i]).join(', ')}</h1><p class="mu">Taxminan ${pg} bet</p><p class="mu">Ro‘yxat kunlik maqsad (${q.rg} bet) to‘lganda to‘xtaydi. ${rest>0?`Navbatda yana ${rest} sura bor, ular keyingi kunlarda chiqadi.`:'Barcha suralar bugunga kirdi.'}</p>`:`<h1 style="font-size:26px">Hali takror yo‘q</h1><p class="mu">Yodlashda sura belgilasang, takror navbati shu yerda chiqadi.</p>`}<p class="mu" style="margin-top:8px">Bugun takror qilingan: ${q.rd[k]||0} bet. Kunlik maqsad: ${q.rg} bet</p>${stp('rg',1)}${a.length?'<button class="big" style="margin-top:6px" onclick="rvDone()">Takror qildim</button>':''}</section><h2>Takror navbati</h2><p class="mu" style="margin:0 0 8px">Yoritilgan suralar bugungi takrorga kiradi.</p>${list||'<p class="mu">Bo‘sh.</p>'}`}
function hatm(){
  const q=S.q,k=dk(),left=604-q.hp,days=Math.ceil(left/q.hg);let jn=1;for(let j=0;j<30;j++)if(q.hp+1>=J[j])jn=j+1;
  return `<section class="hero"><p class="lab">Hatm</p><h1 style="font-size:30px">${q.hp} / 604 bet</h1><div class="bar" style="margin:10px 0"><i style="width:${q.hp/6.04}%"></i></div><p class="mu">Hozirgi pora: ${jn}-pora. Tugatilgan hatmlar: ${q.hc}. Kuniga ${q.hg} bet bilan hatmga ${days} kun qoldi. Bugun o‘qilgan: ${q.hd[k]||0} bet.</p><p class="mu" style="margin-top:8px">Kunlik maqsad: ${q.hg} bet</p>${stp('hg',1)}<button class="big" style="margin-top:6px" onclick="hd(${q.hg})">Bugun ${q.hg} bet o‘qidim</button><button class="ghost" style="color:var(--htx)" onclick="hd(1)">+1 bet</button><button class="ghost" style="color:var(--htx)" onclick="hd(-1)">−1 bet</button></section>`}
function zikr(){
  const z=S.z,c=z.c[dk()]||{},x=ZK[z.sel],t=x[2],v=c[z.sel]||0,rem=v%t,tot=Object.values(c).reduce((a,b)=>a+b,0);
  const chips=ZK.map((y,i)=>`<button class="${z.sel===i?'on':''}" onclick="S.z.sel=${i};render()">${y[0]}</button>`).join('');
  return `<div class="chips" style="margin-top:12px">${chips}</div><p dir="rtl" lang="ar" style="font-size:28px;text-align:center;margin:14px 0 0">${x[1]}</p>
  <button class="tsb" style="background:conic-gradient(var(--ac) ${rem/t*360}deg,var(--c2) 0)" onclick="zt()"><span>${rem}</span></button>
  <p class="mu" style="text-align:center;margin:0">Maqsad: ${t}. To‘liq aylanish: ${Math.floor(v/t)}. Jami bugun: ${tot}</p><button class="ghost" onclick="zr()">Nolga tushirish</button>`}


function go(t){tab=t;render();scrollTo(0,0);const a=$('#app');a.classList.remove('anim');void a.offsetWidth;a.classList.add('anim');setTimeout(()=>a.classList.remove('anim'),1000)}
function hbT(id,k){k=k||dk();(S.hb[k]=S.hb[k]||{})[id]=!S.hb[k][id];save()}
function addH(){const v=$('#nh').value.trim();if(!v)return;S.hab.push({id:'h'+Date.now(),t:v});save()}
function delH(i){if(confirm('Odat o‘chirilsinmi?')){S.hab.splice(i,1);save()}}
function hst(id){let n=0;for(let i=0;i<400;i++){if((S.hb[dAgo(i)]||{})[id])n++;else if(i>0)break}return n}
const gpct=g=>g.ms&&g.ms.length?Math.round(g.ms.filter(m=>m.x).length/g.ms.length*100):(g.p||0);
function gm(i,j){const m=S.goals[i].ms[j];m.x=!m.x;save()}
function gmd(i,j){S.goals[i].ms.splice(j,1);save()}
function gma(i){const e=$('#gm'+i),v=e.value.trim();if(!v)return;const g=S.goals[i];(g.ms=g.ms||[]).push({t:v,x:0});save()}
function gdl(i,v){S.goals[i].dl=v;save()}
function wt(n){S.water[dk()]=Math.max(0,Math.min(8,n));save()}
const fmtT=s=>pad(Math.floor(s/60))+':'+pad(s%60);
function ftick(){FS=Math.max(0,Math.ceil((FE-Date.now())/1000));const e=$('#ft');if(e)e.textContent=fmtT(FS);if(FS<=0){clearInterval(FR);FR=null;S.fm[dk()]=(S.fm[dk()]||0)+FL;FS=FL*60;if(navigator.vibrate)navigator.vibrate([200,100,200]);save()}}
function fgo(){if(FR){clearInterval(FR);FR=null;render();return}FE=Date.now()+FS*1000;FR=setInterval(ftick,500);render()}
function fset(m){if(FR)return;FL=m;FS=m*60;render()}
function frs(){clearInterval(FR);FR=null;FS=FL*60;render()}

async function fn(body){const r=await sb.functions.invoke('create-user',{body});
  if(!r.error)return r.data;
  try{return await r.error.context.json()}catch(e){return{error:'Funksiya topilmadi yoki ishlamadi'}}}
async function loadOw(){const d=await fn({action:'list'});OW=d&&d.users?d.users:false;render()}
function genP(){const c='abcdefghjkmnpqrstuvwxyz23456789';OP=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>c[x%c.length]).join('');render()}
async function mkU(){
  const l=OL.trim().toLowerCase();
  if(!/^[a-z0-9_.]{3,20}$/.test(l)||OP.length<6){OE='Login 3–20 ta lotin harf yoki raqam, parol kamida 6 belgi bo‘lsin.';return render()}
  const d=await fn({action:'create',login:l,password:OP,name:ON.trim()});
  if(!d||d.error){OE=(d&&d.error)||'Xato';return render()}
  OC={login:l,pass:OP};OL=OP=ON=OE='';await loadOw();
}
async function du(id){if(!confirm('Foydalanuvchi va uning ma‘lumoti o‘chirilsinmi?'))return;const d=await fn({action:'delete',id});OE=d&&d.error?d.error:'';await loadOw()}
function cp(){const t='Kunlik tizim\nLink: '+location.origin+location.pathname+'\nLogin: '+OC.login+'\nParol: '+OC.pass;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{OC.copied=1;render()}).catch(()=>{prompt('Nusxalang:',t)})}
function owner(){
  if(!Array.isArray(OW))return '';
  const us=OW.map(u=>`<div class="row"><span class="t">${esc((u.email||'').replace('@trk.app',''))}${u.name?`<br><span class="mu">${esc(u.name)}</span>`:''}</span><button class="x" onclick="du('${u.id}')">×</button></div>`).join('');
  const card=OC?`<div class="goal" style="border:1px solid var(--go)"><b>Tayyor. Yuborish uchun nusxala</b><p class="mu" style="margin:6px 0 10px">Login: ${esc(OC.login)}<br>Parol: ${esc(OC.pass)}</p><button class="btn" onclick="cp()">${OC.copied?'Nusxalandi':'Nusxalash'}</button></div>`:'';
  return `<h2>Foydalanuvchilar</h2>${card}<div class="in"><input placeholder="Login (masalan: aziz01)" value="${esc(OL)}" oninput="OL=this.value" autocapitalize="none"></div><div class="in"><input placeholder="Parol (kamida 6 belgi)" value="${esc(OP)}" oninput="OP=this.value" autocapitalize="none"></div><button class="ghost" style="margin:0 0 8px" onclick="genP()">Parol yaratish</button><div class="in"><input placeholder="Ism (ixtiyoriy)" value="${esc(ON)}" oninput="ON=this.value"></div><p class="err">${esc(OE)}</p><button class="big" style="margin:0 0 14px" onclick="mkU()">Foydalanuvchi qo‘shish</button>${us}`;
}
async function out(){await sb.auth.signOut();UID=null;OW=null;OC=null;S=blank();render()}
function err(t){const e=$('#er');if(e)e.textContent=t}
async function auth(up){
  const l=$('#lg').value.trim().toLowerCase(),p=$('#pw').value;
  if(!l.includes('@')&&!/^[a-z0-9_.]{3,20}$/.test(l))return err('Login 3–20 ta lotin harf yoki raqamdan iborat bo‘lsin.');
  if(p.length<6)return err('Parol kamida 6 belgidan iborat bo‘lsin.');
  const c={email:l.includes('@')?l:l+'@trk.app',password:p};
  const r=up?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);
  if(r.error)return err(/invalid/i.test(r.error.message)?'Login yoki parol noto‘g‘ri.':r.error.message);
    await start(r.data.session.user.id);
}
async function start(id){UID=id;S=load();await pull();render()}
(async()=>{
  if(!sb){S=load();render()}
  else{const r=await sb.auth.getSession();if(r.data.session)await start(r.data.session.user.id);else render()}
  setInterval(()=>{const a=document.activeElement;if(!a||a.tagName!=='INPUT')render()},30000);
})();
</script>
