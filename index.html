    eot=4*(y2*Math.sin(2*L0*D)-2*e*Math.sin(M2*D)+4*e*y2*Math.sin(M2*D)*Math.cos(2*L0*D)-0.5*y2*y2*Math.sin(4*L0*D)-1.25*e*e*Math.sin(2*M2*D))/D;return[dec,eot]};
  const j0=jd(0),ha=(al,dc)=>{const c=(Math.sin(al*D)-Math.sin(lat*D)*Math.sin(dc*D))/(Math.cos(lat*D)*Math.cos(dc*D));return Math.acos(Math.max(-1,Math.min(1,c)))/D};
  const at=(t0,sg,fn)=>{let t=t0;for(let i=0;i<3;i++){const[dc,eo]=sun(j0+(t-tz*60)/1440);t=720-4*lon-eo+tz*60+sg*4*fn(dc)}return t};
  const[d0,e0]=sun(j0+(720-tz*60)/1440),n=720-4*lon-e0+tz*60,R=x=>Math.floor(x+0.5);

  return{Fajr:R(at(n-300,-1,dc=>ha(-15.55,dc))),Sunrise:R(at(n-300,-1,dc=>ha(-0.833,dc))),Dhuhr:R(n),Asr:Math.ceil(at(n+200,1,asr)),Maghrib:R(at(n+300,1,dc=>ha(-0.833,dc))+5.8),Isha:Math.ceil(at(n+400,1,dc=>ha(-15.1,dc)))}}

    else if(st===401&&!m)m='Hisobga qayta kiring.';
    else if(!m)m='Server xatosi ('+(st||'?')+').'}
  else if(e)m='Serverga ulanib bo‘lmadi: '+(e.message||'');
  else if(r.data&&r.data.error)m=r.data.error;
  throw new Error(m||'AI javob bermadi.')}
function aiBuild(){const old=document.getElementById('ai');if(old)old.remove();const d=document.createElement('div');d.id='ai';d.className='ai';
  d.innerHTML=`<div class="aih"><button class="x" style="font-size:22px" onclick="aiClose()">✕</button><div style="flex:1"><b>✨ Yordamchi</b><div class="mu" style="font-size:12px">Kunlik tizim AI</div></div><button class="btn s" style="padding:7px 12px" onclick="aiNew()">Yangi suhbat</button></div><div id="aic" class="aic"></div><div id="aiq" class="aiq">${AIQ.map((q,i)=>`<button onclick="aiGo(${i})">${q}</button>`).join('')}</div><div class="aif"><textarea id="aii" rows="1" placeholder="Savol yoz..." oninput="aiGrow(this)"></textarea><button class="send" onclick="aiGo()">➤</button></div>`;
  document.body.appendChild(d)}
function aiGrow(el){el.style.height='auto';el.style.height=Math.min(120,el.scrollHeight)+'px'}
function aiRender(){const c=document.getElementById('aic');if(!c)return;const A=aiS(),ch=A.chat;
  const hi=`<div class="bb a">Assalomu alaykum${S.name?', '+esc(S.name):''}! Men sening shaxsiy yordamchingman. Kuning, odatlaring, Qur‘on, IELTS va maqsadlaring haqida ma‘lumotlaringni ko‘raman, shunga qarab maslahat beraman. Pastdagi savollardan birini tanla yoki o‘zing yoz.</div>`;
  c.innerHTML=hi+ch.map((m,i)=>{const t=(AIT&&i===ch.length-1&&m.r==='model')?m.t.slice(0,AIT.n):m.t;return `<div class="bb ${m.r==='user'?'u':m.r==='err'?'e':'a'}">${m.r==='user'?esc(t).replace(/\n/g,'<br>'):m.r==='err'?'⚠️ '+esc(t):md(t)}</div>`}).join('')+(AIL?'<div class="bb a"><span class="dots"><span></span><span></span><span></span></span></div>':'');
  c.scrollTop=c.scrollHeight}
function aiOpen(msg){if(!sb||!UID){alert('AI yordamchi uchun hisobga kirgan bo‘lish kerak.');return}aiBuild();aiRender();if(msg)aiSend(msg)}
function aiClose(){const e=document.getElementById('ai');if(e)e.remove()}
function aiNew(){if(AIT&&AIT.iv)clearInterval(AIT.iv);AIT=null;AIL=false;aiS().chat=[];qsave();aiRender()}
function aiClear(){if(confirm('Suhbat tarixi o‘chirilsinmi?')){aiS().chat=[];save()}}
function aiGo(i){if(AIL)return;let t;if(typeof i==='number')t=AIQ[i];else{const e=document.getElementById('aii');t=e?e.value.trim():'';if(e){e.value='';aiGrow(e)}}if(t)aiSend(t)}
async function aiSend(text){
  const A=aiS();A.chat.push({r:'user',t:text});if(A.chat.length>40)A.chat.splice(0,A.chat.length-40);AIL=true;aiRender();qsave();
  try{const hist=A.chat.filter(m=>m.r==='user'||m.r==='model').slice(-10).map(m=>({r:m.r,t:m.t})),r=await aiCall(hist,aiContext());
    A.chat.push({r:'model',t:r.text});AIL=false;AIT={n:0};const len=r.text.length;AIT.iv=setInterval(()=>{AIT.n+=6;if(AIT.n>=len){clearInterval(AIT.iv);AIT=null}aiRender()},22);aiRender()}
  catch(e){AIL=false;A.chat.push({r:'err',t:e.message});aiRender()}
  qsave()}
async function aiTip(){if(AITL)return;AITL=true;render();
  try{const r=await aiCall([{r:'user',t:'Bugun uchun menga 3 ta eng muhim, aniq va qisqa maslahat ber. Ma‘lumotlarimga qarab yoz. Oxirida bitta ruhlantiruvchi gap qo‘sh.'}],aiContext());aiS().tip[dk()]=r.text}
  catch(e){aiS().tip[dk()]='⚠️ '+e.message}AITL=false;save()}
function aiCard(){if(!sb||!UID)return '';const t=aiS().tip[dk()];
  return `<div class="goal" style="margin-top:12px;border-left:4px solid var(--ac)"><div class="h"><b style="font:700 18px Fraunces,serif">✨ Yordamchi</b><button class="x" style="font-size:14px" onclick="aiOpen()">Suhbat</button></div>${AITL?'<p class="mu" style="margin:8px 0 0">Maslahat tayyorlanmoqda…</p>':t?`<div style="margin:8px 0;font-size:14.5px;line-height:1.5">${md(t)}</div><button class="btn s" style="padding:6px 12px" onclick="aiTip()">Yangilash</button>`:`<p class="mu" style="margin:4px 0 10px">Ma‘lumotlaringga qarab bugungi eng muhim maslahatlarni oladi.</p><button class="btn" style="width:100%" onclick="aiTip()">Bugungi maslahatni olish</button>`}</div>`}
function aiSh(k){const sh=aiS().sh;sh[k]=sh[k]?0:1;save()}
async function aiModels(){try{const r=await sb.functions.invoke('ai-assistant',{body:{action:'models'}});if(r.error)throw new Error('Funksiya javob bermadi');const m=(r.data&&r.data.models)||[];alert('Mavjud modellar ('+m.length+'):\n'+m.filter(x=>/flash|pro/i.test(x)).slice(0,25).join('\n')+'\n\nBittasini Supabase secret GEMINI_MODEL sifatida yozishing mumkin.')}catch(e){alert('Modellarni olib bo‘lmadi: '+e.message)}}
function aiSet(){const sh=aiS().sh,row=(k,t)=>`<button class="row ${sh[k]?'done':''}" onclick="aiSh('${k}')"><span class="ck">${sh[k]?'✓':''}</span><span class="t">${t}</span></button>`;
  return `<p class="mu" style="margin:0 0 8px">Yordamchi javob berish uchun tanlangan bo‘limlarning <b>umumiy raqamlarini</b> Google Gemini'ga yuboradi. Shaxsiy yozuvlar (kun xulosasi, izohlar, qarzlar) yuborilmaydi. Chatga o‘zing yozgan matn esa yuboriladi.</p>${row('core','Kun, odat va maqsadlar')}${row('quran','Qur‘on va namoz')}${row('study','IELTS, Univer, Prava, kitob')}${row('health','Zal, kayfiyat, Isolation')}${row('money','Pul (oylik umumiy kirim va chiqim)')}<button class="ghost" onclick="aiClear()">Suhbat tarixini tozalash</button>${Array.isArray(OW)?'<button class="ghost" onclick="aiModels()">Mavjud modellarni ko‘rish</button>':''}`}

async function fn(body){const r=await sb.functions.invoke('create-user',{body});
  if(!r.error)return r.data;
  try{return await r.error.context.json()}catch(e){return{error:'Funksiya topilmadi yoki ishlamadi'}}}
let OS='7',OA='',OST=null,PROF=null;
async function loadOw(){const d=await fn({action:'list'});OW=d&&d.users?d.users:false;OST=d&&d.stats||null;render()}
function genP(){const c='abcdefghjkmnpqrstuvwxyz23456789';OP=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>c[x%c.length]).join('');render()}
const ago=t=>{if(!t)return 'hali kirmagan';const m=Math.floor((Date.now()-new Date(t))/60000);return m<2?'hozirgina':m<60?m+' daqiqa oldin':m<1440?Math.floor(m/60)+' soat oldin':Math.floor(m/1440)+' kun oldin'};
async function ownAct(body){const d=await fn(body);OE=d&&d.error?d.error:'';await loadOw();return !OE}
async function mkU(){
  const l=OL.trim().toLowerCase();
  if(!/^[a-z0-9_.]{3,20}$/.test(l)||OP.length<6){OE='Login 3–20 ta lotin harf yoki raqam, parol kamida 6 belgi bo‘lsin.';return render()}
  if(await ownAct({action:'create',login:l,password:OP,name:ON.trim(),plan:+OS})){OC={login:l,pass:OP};OL=OP=ON='';render()}
}
async function ugr(id,days){if(await ownAct({action:'grant',id,days,amount:sfn(OA)}))OA=''}
function ubl(id,b){ownAct({action:'block',id,blocked:b})}
async function upw(id){const p=prompt('Yangi parol (kamida 6 belgi):');if(!p)return;if(p.length<6){alert('Parol kamida 6 belgi.');return}if(await ownAct({action:'setpass',id,password:p}))alert('Parol almashtirildi: '+p)}
function udl(id){if(confirm('Foydalanuvchi va uning hamma ma‘lumoti o‘chirilsinmi?'))ownAct({action:'delete',id})}
function cp(){const t='Kunlik tizim\nLink: '+location.origin+location.pathname+'\nLogin: '+OC.login+'\nParol: '+OC.pass;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{OC.copied=1;render()}).catch(()=>{prompt('Nusxalang:',t)})}
function stLine(u){const now=Date.now();
  if(u.blocked)return '<span style="color:var(--bad)">Bloklangan</span>';
  if(u.lifetime)return '<span style="color:var(--ac)">∞ Umrbod premium</span>';
  if(!u.expires_at||new Date(u.expires_at)<=now)return '<span style="color:var(--bad)">Obuna tugagan</span>';
  return `<span style="color:var(--ac)">Obuna: ${Math.ceil((new Date(u.expires_at)-now)/864e5)} kun qoldi (${u.expires_at.slice(0,10)})</span>`}
function owner(){
  if(!Array.isArray(OW))return '';
  const s=OST||{month:0,prev:0,total:0},us=OW.map(u=>{const lg=(u.email||'').replace('@trk.app','');
    return `<div class="goal"><b>${esc(u.name||lg)}${u.me?' (siz)':''}</b><p class="mu" style="margin:2px 0">${esc(lg)}, oxirgi faollik: ${ago(u.last)}</p><p style="margin:0 0 ${u.me?0:8}px">${stLine(u)}</p>
    ${u.me?'':`<div class="ug"><button class="btn s" onclick="ugr('${u.id}',1)">+1</button><button class="btn s" onclick="ugr('${u.id}',7)">+7</button><button class="btn s" onclick="ugr('${u.id}',30)">+30</button><button class="btn s" onclick="ugr('${u.id}',-1)">∞</button><button class="btn s" onclick="ubl('${u.id}',${!u.blocked})">${u.blocked?'Ochish':'Blok'}</button></div><div class="in" style="margin:6px 0 0"><button class="btn s" style="flex:1" onclick="upw('${u.id}')">Parol</button><button class="btn s" style="flex:1" onclick="udl('${u.id}')">O‘chirish</button></div>`}</div>`}).join('');
  const card=OC?`<div class="goal" style="border:1px solid var(--go)"><b>Tayyor. Yuborish uchun nusxala</b><p class="mu" style="margin:6px 0 10px">Login: ${esc(OC.login)}<br>Parol: ${esc(OC.pass)}</p><button class="btn" onclick="cp()">${OC.copied?'Nusxalandi':'Nusxalash'}</button></div>`:'';
  return `<h2>Foydalanuvchilar</h2><div class="st"><div><b style="font-size:15px">${num(s.month)}</b>bu oy, so‘m</div><div><b style="font-size:15px">${num(s.prev)}</b>o‘tgan oy</div><div><b style="font-size:15px">${num(s.total)}</b>jami</div></div>
  ${card}<div class="goal" style="margin-top:12px"><b>Yangi foydalanuvchi</b><div class="in" style="margin-top:10px"><input placeholder="Login (masalan: aziz01)" value="${esc(OL)}" oninput="OL=this.value" autocapitalize="none"></div><div class="in"><input placeholder="Parol (kamida 6 belgi)" value="${esc(OP)}" oninput="OP=this.value" autocapitalize="none"></div><button class="ghost" style="margin:0 0 8px" onclick="genP()">Parol yaratish</button><div class="in"><input placeholder="Ism (ixtiyoriy)" value="${esc(ON)}" oninput="ON=this.value"></div><div class="in"><select onchange="OS=this.value">${[['3','Sinov: 3 kun'],['7','Sinov: 7 kun'],['30','30 kun'],['-1','Umrbod premium']].map(x=>`<option value="${x[0]}" ${OS===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></div><p class="err">${esc(OE)}</p><button class="big" style="margin:0" onclick="mkU()">Foydalanuvchi qo‘shish</button></div>
  <h2>Obuna berish</h2><div class="in"><input type="text" inputmode="numeric" placeholder="To‘lov summasi, so‘m (sovg‘a bo‘lsa bo‘sh qoldir)" value="${esc(OA)}" oninput="OA=this.value"></div><p class="mu" style="margin:0 0 8px">Pastdagi +1, +7, +30 yoki ∞ tugmasini bossang, shu summa to‘lov sifatida yoziladi.</p>${us}`;
}

// ---- Obuna va bloklash ----
async function loadProf(){
  if(!sb||!UID)return;
  try{const r=await sb.from('profiles').select('*').eq('user_id',UID).maybeSingle();if(!r.error){PROF=r.data||null;try{localStorage.setItem('trk_prof',JSON.stringify(PROF))}catch(e){}}}catch(e){}
  if(!PROF){try{PROF=JSON.parse(localStorage.getItem('trk_prof')||'null')}catch(e){}}}
const lockMsg=()=>{const p=PROF;if(!p)return '';if(p.blocked)return 'Hisobingiz bloklangan. Egasi bilan bog‘laning.';if(!p.lifetime&&(!p.expires_at||new Date(p.expires_at)<=new Date()))return 'Obuna muddati tugagan. Davom etish uchun egasi bilan bog‘laning.';return ''};
const subDays=()=>PROF&&!PROF.lifetime&&PROF.expires_at?Math.ceil((new Date(PROF.expires_at)-Date.now())/864e5):null;
const subLine=()=>!PROF?'':PROF.lifetime?'∞ Umrbod premium':'Obuna: '+subDays()+' kun qoldi ('+PROF.expires_at.slice(0,10)+')';
const subChip=()=>{const d=subDays();return d!==null&&d<=3&&d>0?` <span class="chip bad">obuna ${d} kun qoldi</span>`:''};
async function recheck(){await loadProf();if(!lockMsg())await pull();render()}
function lockView(){return `<div class="auth"><img src="favicon.svg" width="64" height="64" alt="" style="border-radius:16px;margin-bottom:16px"><h1>Kirish cheklangan</h1>${brand()}<p class="mu">${lockMsg()}</p>${tgBtn('Obuna olish: Telegram’da yozish')}<button class="ghost" onclick="recheck()">Qayta tekshirish</button><button class="ghost" onclick="out()">Chiqish</button></div>`}
async function out(){try{await sb.auth.signOut()}catch(e){}try{localStorage.removeItem('trk_uid')}catch(e){}UID=null;OW=null;OC=null;PROF=null;S=blank();render()}
function err(t){const e=$('#er');if(e)e.textContent=t}
async function auth(up){
  const l=$('#lg').value.trim().toLowerCase(),p=$('#pw').value;
  if(!l.includes('@')&&!/^[a-z0-9_.]{3,20}$/.test(l))return err('Login 3–20 ta lotin harf yoki raqamdan iborat bo‘lsin.');
  if(p.length<6)return err('Parol kamida 6 belgidan iborat bo‘lsin.');
  const c={email:l.includes('@')?l:l+'@trk.app',password:p};
  const r=up?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);
  if(r.error)return err(/invalid/i.test(r.error.message)?'Login yoki parol noto‘g‘ri.':r.error.message);
    await start(r.data.session.user.id,r.data.session.user.email);
}
async function start(id,em){UID=id;try{localStorage.setItem('trk_uid',id);if(em)localStorage.setItem('trk_em',em)}catch(e){}S=load();await loadProf();if(!lockMsg()){await pull();if(S.ts&&!S.sg)sgMig();try{if(localStorage.getItem('trk_dirty'))push()}catch(e){}}render()}
(async()=>{
  if(!sb){S=load();render();ptEnsure()}
  else{
    let ok=false;
    try{const r=await sb.auth.getSession();if(r.data&&r.data.session){ok=true;await start(r.data.session.user.id,r.data.session.user.email);ptEnsure()}}catch(e){}
    if(!ok){let u=null;try{u=localStorage.getItem('trk_uid')}catch(e){}if(u&&navigator.onLine===false)await start(u);else render()}
  }
  ['touchstart','touchmove','scroll'].forEach(ev=>window.addEventListener(ev,()=>{LT=Date.now()},{passive:true}));
  setInterval(()=>{ptEnsure();if(Date.now()-LT<3000)return;if(tab!=='h'&&tab!=='q')return;const a=document.activeElement;if(!a||!/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))render()},30000);
  window.addEventListener('online',()=>{SYNC='ok';let d=null;try{d=localStorage.getItem('trk_dirty')}catch(e){}if(d)push();render()});
  window.addEventListener('offline',()=>{SYNC='off';render()});
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
