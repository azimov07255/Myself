function mrg(B,L,R){
  if(same(L,R))return L;
  if(same(B,L))return R;
  if(same(B,R))return L;
  if(isObj(L)&&isObj(R)){const b=isObj(B)?B:{},o={};
    for(const k of new Set([...Object.keys(L),...Object.keys(R)])){const inL=k in L,inR=k in R,inB=k in b;
      if(inL&&inR)o[k]=mrg(b[k],L[k],R[k]);
      else if(inL){if(inB&&same(b[k],L[k]))continue;o[k]=L[k]}
      else{if(inB&&same(b[k],R[k]))continue;o[k]=R[k]}}
    return o}
  if(idArr(L)&&idArr(R)){const Bb=idArr(B)?B:[],mb=new Map(Bb.map(x=>[x.id,x])),ml=new Map(L.map(x=>[x.id,x])),mr=new Map(R.map(x=>[x.id,x])),out=[];
    for(const id of [...R.map(x=>x.id),...L.filter(x=>!mr.has(x.id)).map(x=>x.id)]){const inL=ml.has(id),inR=mr.has(id),inB=mb.has(id);
      if(inL&&inR)out.push(mrg(mb.get(id),ml.get(id),mr.get(id)));
      else if(inR){if(inB&&same(mb.get(id),mr.get(id)))continue;out.push(mr.get(id))}
      else{if(inB&&same(mb.get(id),ml.get(id)))continue;out.push(ml.get(id))}}
    return out}
  return L}

function nowInfo(){
  const d=new Date(),n=d.getHours()*60+d.getMinutes(),today=bl().filter(b=>b.d.includes(d.getDay()));
  for(const b of today){
    if(n>=b.s&&n<b.e)return{b,nn:n};
    if(n+1440>=b.s&&n+1440<b.e)return{b,nn:n+1440};
  }
  return{nx:today.filter(b=>b.s>n).sort((a,c)=>a.s-c.s)[0],n};
}

const CATS=['Ovqat','Transport','O‘qish','Salomatlik','Kiyim','Ko‘ngil ochish','Aloqa','Uy-joy','Sadaqa','Boshqa'],CIN=['Maosh','Dokon daromadi','Sovg‘a','Boshqa'];
const CI={'Ovqat':'🍽','Transport':'🚕','O‘qish':'📚','Salomatlik':'💊','Kiyim':'👕','Ko‘ngil ochish':'🎮','Aloqa':'📱','Uy-joy':'🏠','Sadaqa':'🤲','Boshqa':'➕','Maosh':'💼','Dokon daromadi':'🏪','Sovg‘a':'🎁'};
const ACN={cash:'Naqd',card:'Karta'};
let PV='b',FACC='cash',FTO='card',FD='',EID=0,PF={mo:0,ac:'all',k:'all',q:''};
function sfn(v){return parseInt(String(v).replace(/[^0-9]/g,''),10)||0}
function finInit(){const f=S.fin;f.open=f.open||{p:{cash:0,card:0},d:{cash:0,card:0}};f.open.p=f.open.p||{cash:0,card:0};f.open.d=f.open.d||{cash:0,card:0};f.sg=f.sg||[];S.debts=S.debts||[];
  if(f.goal&&f.goal.a>0){f.sg.push({id:Date.now(),t:f.goal.t||'Jamg‘arma maqsadi',a:f.goal.a,s:f.goal.s||0});f.goal={t:'',a:0,s:0}}}
const dRem=d=>Math.max(0,d.a-d.pay.reduce((a,x)=>a+x.a,0));
function bal(w){finInit();const o=S.fin.open[w]||{cash:0,card:0},v={cash:o.cash||0,card:o.card||0};
  S.money.filter(m=>m.w===w).forEach(m=>{const ac=m.ac||'cash';if(m.k==='in')v[ac]+=m.a;else if(m.k==='out')v[ac]-=m.a;else if(m.k==='tr'){v[ac]-=m.a;v[m.to||'card']+=m.a}});
  if(w==='p')S.debts.forEach(d=>{if(d.led!==false)v[d.ac||'cash']+=d.k==='borrow'?d.a:-d.a;d.pay.forEach(x=>{v[x.ac||'cash']+=d.k==='borrow'?-x.a:x.a})});
  return{cash:v.cash,card:v.card,tot:v.cash+v.card}}
const mKey=off=>{const d=new Date(new Date().getFullYear(),new Date().getMonth()+off,1);return{k:`${d.getFullYear()}-${pad(d.getMonth()+1)}`,d}};
const mSum=(L,k,ac)=>L.filter(m=>m.k===k&&(!ac||(m.ac||'cash')===ac)).reduce((a,m)=>a+m.a,0);
const mList=(w,k)=>S.money.filter(m=>m.w===w&&m.d.startsWith(k));
function putM(o){const i=S.money.findIndex(x=>x.id===o.id);if(i>=0)S.money[i]=o;else S.money.push(o)}
function addM(){const a=sfn(FA);if(!a)return;const d=FD||dk(),id=EID||Date.now();
  if(K==='tr'){if(FACC===FTO)return;putM({id,d,k:'tr',a,ac:FACC,to:FTO,n:FN.trim(),w:W})}
  else putM({id,d,k:K,a,ac:FACC,n:FN.trim(),w:W,c:(K==='out'?CATS:CIN)[FC]||'Boshqa'});
  EID=0;FA='';FN='';FD='';save()}
function pCancel(){EID=0;FA='';FN='';FD='';render()}
function pEdit(id){const m=S.money.find(x=>x.id===id);if(!m)return;K=m.k;FACC=m.ac||'cash';FTO=m.to||'card';FA=String(m.a);FN=m.n||'';FD=m.d;EID=id;FC=Math.max(0,(m.k==='out'?CATS:CIN).indexOf(m.c));PV='b';render();scrollTo(0,0)}
function dm(id){if(confirm('Yozuv o‘chirilsinmi?')){S.money=S.money.filter(m=>m.id!==id);if(EID===id)pCancel();else save()}}
function pAcc(a){FACC=a;if(K==='tr'&&FTO===a)FTO=a==='cash'?'card':'cash';render()}
function setOpen(ac,v){finInit();S.fin.open[W][ac]=sfn(v);save()}

function pForm(){
  const lst=K==='out'?CATS:CIN,chip=(a,fn,sel)=>`<button class="${sel?'on':''}" onclick="${fn}">${a}</button>`;
  const kind=`<div class="seg"><button class="${K==='out'?'on':''}" onclick="K='out';FC=0;render()">Chiqim</button><button class="${K==='in'?'on':''}" onclick="K='in';FC=0;render()">Kirim</button><button class="${K==='tr'?'on':''}" onclick="K='tr';render()">O‘tkazma</button></div>`;
  const acc=K==='tr'?`<div class="acc"><button class="${FACC==='cash'?'on':''}" onclick="FACC='cash';FTO='card';render()">Naqddan kartaga</button><button class="${FACC==='card'?'on':''}" onclick="FACC='card';FTO='cash';render()">Kartadan naqdga</button></div>`:`<div class="acc"><button class="${FACC==='cash'?'on':''}" onclick="pAcc('cash')">💵 Naqd</button><button class="${FACC==='card'?'on':''}" onclick="pAcc('card')">💳 Karta</button></div>`;
  const cats=K==='tr'?'':`<div class="cchips">${lst.map((c,i)=>`<button class="${FC===i?'on':''}" onclick="FC=${i};render()"><span>${CI[c]||'•'}</span>${c}</button>`).join('')}</div>`;
  return `<div class="goal" style="margin-top:12px"><b>${EID?'Yozuvni tahrirlash':'Yangi yozuv'}</b><div style="margin-top:10px">${kind}${acc}</div>
  <div class="in"><input type="text" inputmode="numeric" placeholder="Summa, so‘m" value="${FA?num(+FA):''}" oninput="FA=String(sfn(this.value));this.value=sfn(this.value)?num(sfn(this.value)):''" style="font-size:20px;font-weight:700"></div>${cats}
  <div class="in"><input placeholder="Izoh" value="${esc(FN)}" oninput="FN=this.value"></div><div class="in"><input type="date" value="${FD||dk()}" onchange="FD=this.value"></div>
  <div class="in"><button class="btn" style="flex:1" onclick="addM()">${EID?'Saqlash':'Yozish'}</button>${EID?'<button class="btn s" onclick="pCancel()">Bekor</button>':''}</div></div>`}
function mRow(m){
  const ac=m.ac||'cash',tr=m.k==='tr',ic=tr?'🔁':(CI[m.c]||'•'),ti=tr?`${ACN[ac]} → ${ACN[m.to||'card']}`:(m.n||m.c||(m.k==='in'?'Kirim':'Chiqim'));
  return `<div class="row" onclick="pEdit(${m.id})"><span style="font-size:22px">${ic}</span><span class="t">${esc(ti)}<br><span class="mu">${tr?esc(m.n||''):ACN[ac]+(m.n&&m.c?', '+esc(m.c):'')}</span></span><b class="${tr?'':m.k==='in'?'in-c':'out-c'}">${tr?'':m.k==='in'?'+':'−'}${num(m.a)}</b><button class="x" onclick="event.stopPropagation();dm(${m.id})">×</button></div>`}

function pBosh(){
  const B=bal(W),mk=mKey(0).k,L=mList(W,mk),inn=mSum(L,'in'),ou=mSum(L,'out'),dB=S.debts.filter(d=>d.st!=='closed');
  const owe=dB.filter(d=>d.k==='borrow').reduce((a,d)=>a+dRem(d),0),lent=dB.filter(d=>d.k==='lend').reduce((a,d)=>a+dRem(d),0);
  const recent=S.money.filter(m=>m.w===W).slice().sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,6).map(mRow).join('');
  return `<section class="hero"><p class="lab">Umumiy balans</p><h1 style="font-size:36px;word-break:break-all">${num(B.tot)} so‘m</h1><div class="pbal"><div><span>💵 Naqd</span><b>${num(B.cash)}</b></div><div><span>💳 Karta</span><b>${num(B.card)}</b></div></div></section>
  <h2>${MON[new Date().getMonth()][0].toUpperCase()+MON[new Date().getMonth()].slice(1)} oyi</h2>
  <div class="sum"><div><span class="mu">Kirim</span><b class="in-c">${num(inn)}</b><span class="mu" style="font-size:12px">naqd ${num(mSum(L,'in','cash'))}, karta ${num(mSum(L,'in','card'))}</span></div><div><span class="mu">Chiqim</span><b class="out-c">${num(ou)}</b><span class="mu" style="font-size:12px">naqd ${num(mSum(L,'out','cash'))}, karta ${num(mSum(L,'out','card'))}</span></div><div class="w"><span class="mu">Oy balansi</span><b>${num(inn-ou)} so‘m</b></div></div>
  ${W==='p'&&(owe||lent)?`<button class="row" onclick="PV='q';render()"><span class="t">Qarzlar<br><span class="mu">Men qarzdorman: ${num(owe)}. Menga qarzdor: ${num(lent)}</span></span></button>`:''}
  ${pForm()}<h2>So‘nggi yozuvlar</h2>${recent||'<p class="mu">Hali yozuv yo‘q.</p>'}`}

function pTarix(){
  const mk=mKey(PF.mo),mn=MON[mk.d.getMonth()];let L=mList(W,mk.k);
  if(PF.ac!=='all')L=L.filter(m=>(m.ac||'cash')===PF.ac||(m.k==='tr'&&m.to===PF.ac));
  if(PF.k!=='all')L=L.filter(m=>m.k===PF.k);
  if(PF.q)L=L.filter(m=>sn((m.n||'')+' '+(m.c||'')).includes(sn(PF.q)));
  L=L.slice().sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);const g={};L.forEach(m=>(g[m.d]=g[m.d]||[]).push(m));
  const chips=(arr,key)=>`<div class="chips">${arr.map(([v,t])=>`<button class="${PF[key]===v?'on':''}" onclick="PF.${key}='${v}';render()">${t}</button>`).join('')}</div>`;
  const days=Object.keys(g).sort().reverse().map(d=>{const dn=mSum(g[d],'in')-mSum(g[d],'out');return `<p class="mu" style="margin:14px 0 6px;display:flex;justify-content:space-between"><span>${+d.slice(8)}-${MON[+d.slice(5,7)-1]}</span><span>${dn>=0?'+':'−'}${num(Math.abs(dn))}</span></p>${g[d].map(mRow).join('')}`}).join('');
  return `<div class="in"><button class="btn s" onclick="PF.mo--;render()">‹</button><button class="btn s" onclick="PF.mo=0;render()">${mn[0].toUpperCase()+mn.slice(1)} ${mk.d.getFullYear()}</button><button class="btn s" onclick="PF.mo++;render()">›</button></div>
  ${chips([['all','Hammasi'],['cash','Naqd'],['card','Karta']],'ac')}${chips([['all','Barchasi'],['in','Kirim'],['out','Chiqim'],['tr','O‘tkazma']],'k')}
  <div class="in"><input placeholder="Izoh yoki kategoriya bo‘yicha qidirish" value="${esc(PF.q)}" onchange="PF.q=this.value;render()"></div>
  <p class="mu" style="margin:0">Kirim ${num(mSum(L,'in'))}, chiqim ${num(mSum(L,'out'))}. Yozuvni bossang, tahrirlanadi.</p>${days||'<p class="mu">Bu oyda yozuv yo‘q.</p>'}`}

// ---- Qarzlar ----
function dAdd(){const p=V('dpn'),a=sfn(V('dpa')),k=V('dpk')||'borrow';if(!p||!a)return;S.debts.push({id:Date.now(),p,k,a,d:dk(),due:V('dpd'),n:V('dpt'),ac:V('dpc')||'cash',led:V('dpl')!=='0',pay:[],st:'open'});save()}
function dPay(id){const d=S.debts.find(x=>x.id===id),a=Math.min(sfn(V('dq'+id)),dRem(d));if(!a)return;d.pay.push({id:Date.now(),d:dk(),a,ac:V('dc'+id)||'cash'});if(dRem(d)<=0)d.st='closed';save()}
function dClose(id){const d=S.debts.find(x=>x.id===id);d.st=d.st==='closed'?'open':'closed';save()}
function dDel(id){if(confirm('Qarz yozuvi o‘chirilsinmi? Balansga ta‘siri ham bekor bo‘ladi.')){S.debts=S.debts.filter(x=>x.id!==id);save()}}
function pQarz(){
  if(W==='d')return `<p class="mu">Qarzlar shaxsiy hisobda yuritiladi.</p><button class="btn" onclick="W='p';render()">Shaxsiyga o‘tish</button>`;
  const acs=`<option value="cash">Naqd</option><option value="card">Karta</option>`;
  const card=d=>{const rem=dRem(d),paid=d.a-rem,n=d.due?dl(d.due):null,late=d.st!=='closed'&&n!==null&&n<0,bor=d.k==='borrow';
    return `<div class="dbt ${bor?'':'lend'} ${late?'late':''}" style="${d.st==='closed'?'opacity:.6':''}"><div style="display:flex;justify-content:space-between;gap:8px"><b style="font:700 18px Fraunces,serif">${esc(d.p)}</b><button class="x" onclick="dDel(${d.id})">×</button></div>
    <p class="mu" style="margin:2px 0 6px">${bor?'Men qarzdorman':'Menga qarzdor'}${d.n?', '+esc(d.n):''}</p><div class="bar"><i style="width:${d.a?paid/d.a*100:0}%"></i></div>
    <p style="margin:6px 0 0"><b>${num(rem)}</b> <span class="mu">qoldi, jami ${num(d.a)}</span></p><p class="mu" style="margin:2px 0 8px;${late?'color:var(--bad)':''}">${d.st==='closed'?'Yopilgan':d.due?'Muddat: '+d.due.slice(8)+'.'+d.due.slice(5,7)+'.'+d.due.slice(0,4)+', '+dlTxt(n):'Muddat belgilanmagan'}</p>
    ${d.st!=='closed'?`<div class="in"><input id="dq${d.id}" type="text" inputmode="numeric" placeholder="${bor?'Qaytardim':'Qaytarib berdi'}, so‘m"><select id="dc${d.id}" style="flex:0 0 96px">${acs}</select><button class="btn" onclick="dPay(${d.id})">+</button></div>`:''}
    <div class="in" style="margin:0"><button class="btn s" style="flex:1" onclick="dClose(${d.id})">${d.st==='closed'?'Qayta ochish':'Yopish'}</button></div>${d.pay.length?`<p class="mu" style="margin:8px 0 0;font-size:12px">To‘lovlar: ${d.pay.map(x=>x.d.slice(8)+'.'+x.d.slice(5,7)+' '+num(x.a)).join(', ')}</p>`:''}</div>`};
  const open=S.debts.filter(d=>d.st!=='closed').sort((a,b)=>(a.due||'9')>(b.due||'9')?1:-1),shut=S.debts.filter(d=>d.st==='closed');
  const owe=open.filter(d=>d.k==='borrow'),lent=open.filter(d=>d.k==='lend'),sm=a=>a.reduce((s,d)=>s+dRem(d),0);
  return `<div class="sum"><div><span class="mu">Men qarzdorman</span><b class="out-c">${num(sm(owe))}</b></div><div><span class="mu">Menga qarzdor</span><b class="in-c">${num(sm(lent))}</b></div></div>
  <div class="goal"><b>Yangi qarz</b><div class="in" style="margin-top:10px"><select id="dpk"><option value="borrow">Men qarz oldim</option><option value="lend">Men qarz berdim</option></select></div>
  <div class="in"><input id="dpn" placeholder="Kim bilan (ism)"></div><div class="in"><input id="dpa" type="text" inputmode="numeric" placeholder="Summa, so‘m"><select id="dpc" style="flex:0 0 96px">${acs}</select></div>
  <div class="in"><input id="dpd" type="date"><span class="mu" style="align-self:center;white-space:nowrap">muddat</span></div><div class="in"><input id="dpt" placeholder="Izoh (ixtiyoriy)"></div>
  <div class="in"><select id="dpl"><option value="1">Balansga ta‘sir qilsin</option><option value="0">Faqat yozib qo‘yish</option></select></div><button class="btn" onclick="dAdd()">Qo‘shish</button></div>
  ${owe.length?`<h2>Men qarzdorman</h2>${owe.map(card).join('')}`:''}${lent.length?`<h2>Menga qarzdor</h2>${lent.map(card).join('')}`:''}${shut.length?`<h2>Yopilgan</h2>${shut.map(card).join('')}`:''}${!S.debts.length?'<p class="mu">Qarz yozuvi yo‘q.</p>':''}`}

// ---- Hisobot ----
function pHisob(){
  const mk=mKey(PF.mo),pk=mKey(PF.mo-1),L=mList(W,mk.k),P=mList(W,pk.k),inn=mSum(L,'in'),ou=mSum(L,'out'),pou=mSum(P,'out'),nd=new Date(mk.d.getFullYear(),mk.d.getMonth()+1,0).getDate(),el=PF.mo===0?new Date().getDate():nd,mn=MON[mk.d.getMonth()];
  const cat={};L.filter(m=>m.k==='out').forEach(m=>{const c=m.c||'Boshqa';cat[c]=(cat[c]||0)+m.a});const cs=Object.entries(cat).sort((a,b)=>b[1]-a[1]);
  const day=[...Array(nd)].map((_,i)=>L.filter(m=>m.k==='out'&&m.d.endsWith('-'+pad(i+1))).reduce((a,m)=>a+m.a,0)),mx=Math.max(1,...day);
  const top=L.filter(m=>m.k==='out').sort((a,b)=>b.a-a.a).slice(0,5).map(mRow).join('');
  const tr=[5,4,3,2,1,0].map(o=>{const k=mKey(PF.mo-o).k,l=mList(W,k);return{l:MON[+k.slice(5)-1].slice(0,3),i:mSum(l,'in'),o:mSum(l,'out')}}),tm=Math.max(1,...tr.flatMap(x=>[x.i,x.o]));
  const diff=pou?Math.round((ou-pou)/pou*100):null;
  return `<div class="in"><button class="btn s" onclick="PF.mo--;render()">‹</button><button class="btn s" onclick="PF.mo=0;render()">${mn[0].toUpperCase()+mn.slice(1)} ${mk.d.getFullYear()}</button><button class="btn s" onclick="PF.mo++;render()">›</button></div>
  <section class="hero"><p class="lab">Oylik xulosa</p><h1 style="font-size:32px">${inn-ou>=0?'+':'−'}${num(Math.abs(inn-ou))} so‘m</h1><p class="mu">Kirim ${num(inn)}, chiqim ${num(ou)}.${inn?` Jamg‘arish ulushi ${Math.round((inn-ou)/inn*100)}%.`:''}</p><div class="pbal"><div><span>💵 Naqd chiqim</span><b>${num(mSum(L,'out','cash'))}</b></div><div><span>💳 Karta chiqim</span><b>${num(mSum(L,'out','card'))}</b></div></div></section>
  <div class="sum"><div><span class="mu">Kunlik o‘rtacha chiqim</span><b>${num(Math.round(ou/Math.max(1,el)))}</b></div><div><span class="mu">O‘tgan oyga nisbatan</span><b class="${diff>0?'out-c':'in-c'}">${diff===null?'—':(diff>0?'+':'')+diff+'%'}</b></div></div>
  <h2>Chiqim kategoriyalari</h2>${cs.map(([c,v])=>`<div style="margin-bottom:8px"><div style="display:flex;justify-content:space-between"><span>${CI[c]||''} ${esc(c)}</span><span class="mu">${num(v)}, ${Math.round(v/Math.max(1,ou)*100)}%</span></div><div class="bar"><i style="width:${v/Math.max(1,ou)*100}%"></i></div></div>`).join('')||'<p class="mu">Bu oyda chiqim yo‘q.</p>'}
  <h2>Kunlar bo‘yicha chiqim</h2><div class="bars2">${day.map(v=>`<i style="height:${Math.max(2,v/mx*80)}px"></i>`).join('')}</div>
  <h2>Eng katta chiqimlar</h2>${top||'<p class="mu">Yo‘q.</p>'}
  <h2>So‘nggi 6 oy</h2><div class="bars2" style="height:90px;gap:6px">${tr.map(x=>`<div style="flex:1;display:flex;gap:2px;align-items:flex-end;height:90px"><i style="height:${Math.max(2,x.i/tm*90)}px;background:var(--ac)"></i><i style="height:${Math.max(2,x.o/tm*90)}px;background:var(--bad)"></i></div>`).join('')}</div><div style="display:flex;gap:6px">${tr.map(x=>`<span class="mu" style="flex:1;text-align:center;font-size:11px">${x.l}</span>`).join('')}</div><p class="mu" style="margin:6px 0 0;font-size:12px">Yashil: kirim, qizil: chiqim.</p>`}

// ---- Reja: byudjet, jamg'arma, boshlang'ich qoldiq ----
function sgAddG(){const t=V('sgt'),a=sfn(V('sga'));if(!t||!a)return;finInit();S.fin.sg.push({id:Date.now(),t,a,s:0});save()}
function sgPut(id){const g=S.fin.sg.find(x=>x.id===id),v=sfn(V('sgp'+id));if(!v)return;g.s+=v;save()}
function sgDel(id){if(confirm('Maqsad o‘chirilsinmi?')){S.fin.sg=S.fin.sg.filter(x=>x.id!==id);save()}}
function pReja(){
  finInit();const o=S.fin.open[W],mk=mKey(0).k,po=mSum(mList('p',mk),'out'),bud=S.fin.budget||0,n0=new Date(),dl2=new Date(n0.getFullYear(),n0.getMonth()+1,0).getDate()-n0.getDate()+1;
  const goals=S.fin.sg.map(g=>{const p=Math.min(100,g.s/g.a*100);return `<div class="goal"><div class="h"><b>${esc(g.t)}</b><button class="x" onclick="sgDel(${g.id})">×</button></div><div class="bar" style="margin:8px 0"><i style="width:${p}%"></i></div><p class="mu" style="margin:0 0 8px">${num(g.s)} / ${num(g.a)} (${Math.round(p)}%). Qoldi ${num(Math.max(0,g.a-g.s))}.</p><div class="in" style="margin:0"><input id="sgp${g.id}" type="text" inputmode="numeric" placeholder="Qo‘shilgan summa"><button class="btn" onclick="sgPut(${g.id})">+</button></div></div>`}).join('');
  return `<h2>Boshlang‘ich qoldiq (${W==='p'?'shaxsiy':'dokon'})</h2><p class="mu" style="margin:0 0 8px">Hozir qancha pul bor? Balans shundan hisoblanadi.</p><div class="in"><span style="align-self:center;min-width:54px">💵 Naqd</span><input type="text" inputmode="numeric" value="${o.cash||''}" onchange="setOpen('cash',this.value)"></div><div class="in"><span style="align-self:center;min-width:54px">💳 Karta</span><input type="text" inputmode="numeric" value="${o.card||''}" onchange="setOpen('card',this.value)"></div>
  <h2>Oylik byudjet (shaxsiy chiqim)</h2><div class="in"><input type="text" inputmode="numeric" placeholder="Oylik limit, so‘m" value="${bud||''}" onchange="S.fin.budget=sfn(this.value);save()"></div>${bud?`<div class="bar"><i style="width:${Math.min(100,po/bud*100)}%;${po>bud?'background:var(--bad)':''}"></i></div><p class="mu">Sarflandi ${num(po)} / ${num(bud)}. ${po>bud?'Limitdan '+num(po-bud)+' oshdi.':'Qoldi '+num(bud-po)+', kuniga taxminan '+num(Math.floor((bud-po)/dl2))+' so‘m.'}</p>`:'<p class="mu">Limit qo‘ysang, ilova qolgan summani va kunlik me‘yorni ko‘rsatadi.</p>'}
  <h2>Jamg‘arma maqsadlari</h2>${goals}<div class="goal"><div class="in"><input id="sgt" placeholder="Nima uchun? Masalan: Prava kursi"></div><div class="in"><input id="sga" type="text" inputmode="numeric" placeholder="Kerakli summa, so‘m"><button class="btn" onclick="sgAddG()">Qo‘sh</button></div></div>`}

function pul(){
  finInit();

function ptCalc(y,m,d,lat,lon,tz){
  const D=Math.PI/180;
  const jd=h=>{let Y=y,M=m;if(M<=2){Y--;M+=12}const A=Math.floor(Y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(Y+4716))+Math.floor(30.6001*(M+1))+d+B-1524.5+h/24};
  const sun=j=>{const T=(j-2451545)/36525,L0=(280.46646+T*(36000.76983+T*0.0003032))%360,M2=357.52911+T*(35999.05029-0.0001537*T),e=0.016708634-T*(0.000042037+0.0000001267*T),
    C=Math.sin(M2*D)*(1.914602-T*(0.004817+0.000014*T))+Math.sin(2*M2*D)*(0.019993-0.000101*T)+Math.sin(3*M2*D)*0.000289,om=125.04-1934.136*T,lam=L0+C-0.00569-0.00478*Math.sin(om*D),
    e0=23+(26+(21.448-T*(46.815+T*(0.00059-T*0.001813)))/60)/60,eps=e0+0.00256*Math.cos(om*D),dec=Math.asin(Math.sin(eps*D)*Math.sin(lam*D))/D,y2=Math.tan(eps*D/2)**2,
    eot=4*(y2*Math.sin(2*L0*D)-2*e*Math.sin(M2*D)+4*e*y2*Math.sin(M2*D)*Math.cos(2*L0*D)-0.5*y2*y2*Math.sin(4*L0*D)-1.25*e*e*Math.sin(2*M2*D))/D;return[dec,eot]};
  const j0=jd(0),ha=(al,dc)=>{const c=(Math.sin(al*D)-Math.sin(lat*D)*Math.sin(dc*D))/(Math.cos(lat*D)*Math.cos(dc*D));return Math.acos(Math.max(-1,Math.min(1,c)))/D};
  const at=(t0,sg,fn)=>{let t=t0;for(let i=0;i<3;i++){const[dc,eo]=sun(j0+(t-tz*60)/1440);t=720-4*lon-eo+tz*60+sg*4*fn(dc)}return t};
  const[d0,e0]=sun(j0+(720-tz*60)/1440),n=720-4*lon-e0+tz*60,R=x=>Math.floor(x+0.5);
  const asr=dc=>ha(Math.atan(1/(2+Math.tan(Math.abs(lat-dc)*D)))/D,dc);
  return{Fajr:R(at(n-300,-1,dc=>ha(-15.55,dc))),Sunrise:R(at(n-300,-1,dc=>ha(-0.833,dc))),Dhuhr:R(n),Asr:Math.ceil(at(n+200,1,asr)),Maghrib:R(at(n+300,1,dc=>ha(-0.833,dc))+5.8),Isha:Math.ceil(at(n+400,1,dc=>ha(-15.1,dc)))}}

  for(const [k,nm] of PNAMES){if(k==='Sunrise')continue;if(t[k]>n)return{n:nm,t:t[k],left:t[k]-n}}
  return{n:'Bomdod',t:t.Fajr,left:t.Fajr+1440-n}}

const IDBO=()=>new Promise((res,rej)=>{const r=indexedDB.open('trk-files',1);r.onupgradeneeded=()=>r.result.createObjectStore('pdf');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function idbSet(k,v){const d=await IDBO();return new Promise((res,rej)=>{const t=d.transaction('pdf','readwrite');t.objectStore('pdf').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function idbGet(k){const d=await IDBO();return new Promise((res,rej)=>{const q=d.transaction('pdf').objectStore('pdf').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function idbDel(k){const d=await IDBO();return new Promise((res,rej)=>{const t=d.transaction('pdf','readwrite');t.objectStore('pdf').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}

function toast(t){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='pointer-events:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 140px);background:#222;color:#fff;padding:10px 16px;border-radius:14px;z-index:200;font-size:14px;max-width:86%;text-align:center';document.body.appendChild(e)}e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>{e.style.display='none'},3500)}
async function cloudUp(b,buf){if(!sb||!UID)return;if(!cloudOk(buf.byteLength)){toast('Bulut limiti to‘ldi: PDF faqat shu telefonda qoladi');return}b.sz=buf.byteLength;PUPL[b.id]=1;render();
  try{const r=await sb.storage.from('books').upload(UID+'/'+b.id+'.pdf',new Blob([buf],{type:'application/pdf'}),{upsert:true,contentType:'application/pdf'});if(r.error)throw r.error;b.cloud=1;save();toast('PDF bulutga saqlandi')}
  catch(e){toast('Bulutga yuklanmadi: '+(e.message||e)+'. PDF faqat shu telefonda qoldi.')}
  delete PUPL[b.id];render()}
function cloudDel(id){if(sb&&UID)sb.storage.from('books').remove([UID+'/'+id+'.pdf']).catch(()=>{})}
let PDFL=null;

async function ktPdf(inp,id){
  const f=inp.files&&inp.files[0];if(!f)return;
  try{const buf=await f.arrayBuffer(),lib=await loadPdfjs(),doc=await lib.getDocument({data:buf.slice(0)}).promise,n=doc.numPages;doc.destroy();
    let b=id?ktB(id):null;
    if(!b){b={id:Date.now(),t:f.name.replace(/\.pdf$/i,''),a:'',n,p:0,st:'o',fin:'',r:0,sum:'',pdf:1,cur:1};S.kt.books.push(b)}
    else{b.n=n;b.pdf=1;b.cur=b.cur||Math.max(1,b.p)}
    await idbSet(b.id,buf);try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(x){}save();cloudUp(b,buf);
  }catch(e){alert('PDF ochilmadi: '+(e.message||e))}

async function ktPdfDel(id){if(!confirm('PDF fayl o‘chirilsinmi? Kitob va o‘qilgan betlar qoladi.'))return;try{await idbDel(id)}catch(e){}const b=ktB(id);cloudDel(id);if(b){b.pdf=0;b.cloud=0}save()}

function pgTrack(b,p){b.cur=p;if(p>b.p){const d=p-b.p;if(d<=3)ktLog(b,d);b.p=p;if(b.n&&b.p>=b.n&&b.st==='o'){b.st='t';b.fin=dk()}}}
let RD=null;
async function rdOpen(id){
  const b=ktB(id);if(!b)return;
  try{let buf=await idbGet(id);
    if(!buf&&b.cloud&&sb&&UID){toast('PDF bulutdan yuklab olinmoqda...');const r=await sb.storage.from('books').download(UID+'/'+id+'.pdf');if(r.error)throw r.error;buf=await r.data.arrayBuffer();await idbSet(id,buf)}
    if(!buf){alert('Bu qurilmada PDF topilmadi. Qayta yuklash uchun “PDF o‘chirish” va keyin “PDF qo‘shish” ni bos.');return}
    const lib=await loadPdfjs(),doc=await lib.getDocument({data:buf.slice(0)}).promise;
    rdClose(true);RD={id,doc,n:doc.numPages,page:1,zoom:1,tok:0};rdBuild(b);await rdShow(b.cur||1)

function rdBuild(b){const old=document.getElementById('rd');if(old)old.remove();const d=document.createElement('div');d.id='rd';d.className='rdo';
  d.innerHTML=`<div class="rdt"><button class="x" style="font-size:22px" onclick="rdClose()">✕</button><b style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.t)}</b><span id="rdn" class="mu"></span></div><div id="rdc" class="rdc"><canvas id="rdv"></canvas></div><div class="rdb"><button class="btn s" onclick="rdGo(-1)">‹</button><input id="rdp" type="number" inputmode="numeric" onchange="rdSet(this.value)"><button class="btn s" onclick="rdGo(1)">›</button><button class="btn s" onclick="rdZ(-0.25)">−</button><button class="btn s" onclick="rdZ(0.25)">+</button></div>`;
  document.body.appendChild(d);let x0=null;const c=d.querySelector('#rdc');
  c.addEventListener('touchstart',e=>{x0=e.touches.length===1?e.touches[0].clientX:null},{passive:true});
  c.addEventListener('touchend',e=>{if(x0===null||RD.zoom>1)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>70)rdGo(dx<0?1:-1);x0=null},{passive:true})}
async function rdShow(p){
  const R=RD;if(!R)return;p=Math.max(1,Math.min(R.n,Math.round(p)||1));R.page=p;const t=++R.tok;
  const pg=await R.doc.getPage(p),box=document.getElementById('rdc'),cv=document.getElementById('rdv');if(!box||!cv||t!==R.tok)return;
  const v0=pg.getViewport({scale:1}),dpr=window.devicePixelRatio||1,sc=box.clientWidth/v0.width*R.zoom,vp=pg.getViewport({scale:sc*dpr});

  box.scrollTop=0;document.getElementById('rdp').value=p;document.getElementById('rdn').textContent=p+' / '+R.n;

function psV(k){const v=S.gym.pass.v,c=v[k],nx={undefined:'p',p:'d',d:'m',m:undefined}[c];if(nx)v[k]=nx;else delete v[k];save()}
function psAuto(){const P=S.gym.pass,T0=dk();Object.keys(P.v).forEach(k=>{if(P.v[k]==='p'&&k>=T0)delete P.v[k]});
  const done=Object.values(P.v).filter(x=>x==='d').length,rem=P.t-done,days=[];for(let k=T0>P.s?T0:P.s;k<=P.e;k=nxtDay(k))if(!P.v[k])days.push(k);
  if(rem<=0||!days.length){save();return}const n=Math.min(rem,days.length);for(let i=0;i<n;i++)P.v[days[Math.floor((i+0.5)*days.length/n)]]='p';save()}
function psEnd(){if(confirm('Abonement tugatilsinmi? U tarixga o‘tadi.')){S.gym.past.push(S.gym.pass);S.gym.pass=null;save()}}
function psStat(){const P=S.gym.pass;if(!P)return null;const T0=dk(),vs=Object.values(P.v),done=vs.filter(x=>x==='d').length,miss=vs.filter(x=>x==='m').length,
  plan=Object.keys(P.v).filter(k=>P.v[k]==='p'&&k>=T0).length,rem=Math.max(0,P.t-done),over=T0>P.e,from=T0<P.s?P.s:T0,days=over?0:dl(P.e)-dl(from)+1,burn=Math.max(0,rem-days);
  return{done,miss,plan,rem,days,burn,perWeek:days?r1(rem/(days/7)):0,over,total:dl(P.e)-dl(P.s)+1}}

  if(P.v[k]==='d')delete P.v[k];else{P.v[k]='d';const st=psStat();if(st.done>=P.t){confetti();toast('Abonement to‘liq bajarildi! 🎉')}else toast('Barakalla! 💪 Yana '+st.rem+' ta qoldi')}save()}

  <div class="bn ${bn[0]}">${bn[1]}</div>

function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));return btoa(s)}
async function fnAI(body){const d=await fnPost(body,({ielts:95000,vocab:105000,reading:105000,iex:105000})[body.action]||60000);if(!d.text)throw new Error('AI javob bermadi.');aiCount(1,body.action);return d}
function parseJson(t){let s=String(t||'').replace(/```json|```/g,'').trim();const a=s.indexOf('{'),b=s.lastIndexOf('}');if(a<0||b<a)return null;try{return JSON.parse(s.slice(a,b+1))}catch(e){return null}}
function shrink(f,max){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(f);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.8).split(',')[1])};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Rasm ochilmadi'))};img.src=u})}
async function fdPic(inp){const f=inp.files&&inp.files[0];inp.value='';if(!f)return;try{FDI=await shrink(f,900);render()}catch(e){alert(e.message)}}
async function fdAI(){const t=V('fdt');if(!t&&!FDI)return alert('Ovqat nomini yozing yoki rasm yuboring.');if(!sb||!UID)return alert('AI uchun hisobga kirgan bo‘lish kerak.');
  FDL=true;FDR=null;render();
  try{const d=await fnAI({action:'food',text:t,image:FDI||undefined,mime:'image/jpeg'}),j=parseJson(d.text);

const DU=[{"id": "ak", "c": ["sb", "sh", "nm", "uy"], "k": 1, "t": "Oyatul Kursi (Baqara, 255)", "ar": "اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ الْحَيُّ الْقَيُّومُ ۚ لَا تَأْخُذُهُ سِنَةٌ وَلَا نَوْمٌ ۚ لَهُ مَا فِي السَّمَاوَاتِ وَمَا فِي الْأَرْضِ ۗ مَنْ ذَا الَّذِي يَشْفَعُ عِنْدَهُ إِلَّا بِإِذْنِهِ ۚ يَعْلَمُ مَا بَيْنَ أَيْدِيهِمْ وَمَا خَلْفَهُمْ ۖ وَلَا يُحِيطُونَ بِشَيْءٍ مِنْ عِلْمِهِ إِلَّا بِمَا شَاءَ ۚ وَسِعَ كُرْسِيُّهُ السَّمَاوَاتِ وَالْأَرْضَ ۖ وَلَا يَئُودُهُ حِفْظُهُمَا ۚ وَهُوَ الْعَلِيُّ الْعَظِيمُ", "tr": "Allohu la ilaha illa huval hayyul qayyum, la ta’xuzuhu sinatun va la navm, lahu ma fis-samavati va ma fil-arz, man zal-lazi yashfa’u ‘indahu illa bi iznih, ya’lamu ma bayna aydihim va ma xalfahum, va la yuhituna bi shay’im min ‘ilmihi illa bima sha’, vasi’a kursiyyuhus-samavati val-arz, va la ya’uduhu hifzuhuma, va huval ‘aliyyul ‘azim.", "uz": "Alloh — Undan o‘zga iloh yo‘q, tirik va doimiy turuvchi. Uni na mudroq, na uyqu tutadi. Osmonlar va yerdagi hamma narsa Unikidir. Uning iznisiz kim Uning huzurida shafoat qila oladi? U ularning oldidagi va ortidagi narsalarni biladi. Ular Uning ilmidan U xohlagan narsadangina bilib oladilar. Kursiysi osmonlar va yerni qamrab olgan, ularni saqlash Uni charchatmaydi. U Oliy va Ulug‘dir."}, {"id": "ik", "c": ["sb", "sh", "uy"], "k": 3, "t": "Ixlos surasi", "ar": "قُلْ هُوَ اللَّهُ أَحَدٌ ۝ اللَّهُ الصَّمَدُ ۝ لَمْ يَلِدْ وَلَمْ يُولَدْ ۝ وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ", "tr": "Qul huvallohu ahad. Allohus-samad. Lam yalid va lam yulad. Va lam yakun lahu kufuvan ahad.", "uz": "Ayt: U Alloh — yagonadir. Alloh behojatdir. U tug‘madi va tug‘ilmadi. Va Unga hech kim teng emas."}, {"id": "fl", "c": ["sb", "sh", "uy"], "k": 3, "t": "Falaq surasi", "ar": "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ۝ مِنْ شَرِّ مَا خَلَقَ ۝ وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ ۝ وَمِنْ شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ۝ وَمِنْ شَرِّ حَاسِدٍ إِذَا حَسَدَ", "tr": "Qul a’uzu birabbil-falaq. Min sharri ma xalaq. Va min sharri g‘osiqin iza vaqab. Va min sharrin-naffasati fil-‘uqad. Va min sharri hasidin iza hasad.", "uz": "Ayt: Tong Parvardigoriga sig‘inaman — U yaratgan narsalarning yomonligidan, qorong‘i tushganda kirgan zulmat yomonligidan, tugunlarga puflovchilarning yomonligidan va hasad qilganda hasadchining yomonligidan."}, {"id": "ns", "c": ["sb", "sh", "uy"], "k": 3, "t": "Nos surasi", "ar": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ ۝ مَلِكِ النَّاسِ ۝ إِلَٰهِ النَّاسِ ۝ مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ۝ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ۝ مِنَ الْجِنَّةِ وَالنَّاسِ", "tr": "Qul a’uzu birabbin-nas. Malikin-nas. Ilahin-nas. Min sharril-vasvasil-xannas. Allazi yuvasvisu fi suduril-nas. Minal jinnati van-nas.", "uz": "Ayt: Odamlar Parvardigoriga, odamlar Podshohiga, odamlar Ilohiga sig‘inaman — vasvasachi yashirinuvchi (shayton)ning yomonligidan; u odamlarning ko‘ksiga vasvasa soladi; jinlardan ham, odamlardan ham."}, {"id": "sa", "c": ["sb"], "k": 1, "t": "Ertalabki zikr", "ar": "أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ", "tr": "Asbahna va asbahal-mulku lillah, val-hamdu lillah, la ilaha illallohu vahdahu la sharika lah.", "uz": "Biz tong ottirdik, mulk ham Allohniki bo‘lgan holda tong otdi. Hamd Allohgadir. Allohdan o‘zga iloh yo‘q, U yagonadir, Uning sherigi yo‘q."}, {"id": "ss", "c": ["sh"], "k": 1, "t": "Kechqurunggi zikr", "ar": "أَمْسَيْنَا وَأَمْسَى الْمُلْكُ لِلَّهِ، وَالْحَمْدُ لِلَّهِ، لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ", "tr": "Amsayna va amsal-mulku lillah, val-hamdu lillah, la ilaha illallohu vahdahu la sharika lah.", "uz": "Biz kechga yetdik, mulk ham Allohniki bo‘lgan holda kech kirdi. Hamd Allohgadir. Allohdan o‘zga iloh yo‘q, U yagonadir, Uning sherigi yo‘q."}, {"id": "sb2", "c": ["sb"], "k": 1, "t": "Ertalab: Allohumma bika asbahna", "ar": "اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ", "tr": "Allohumma bika asbahna va bika amsayna va bika nahya va bika namutu va ilaykan-nushur.", "uz": "Ey Alloh, Sening ehsoning bilan tong ottirdik, Sening ehsoning bilan kech kirdirdik, Sen bilan tirilamiz, Sen bilan o‘lamiz va qaytish Senga."}, {"id": "sh2", "c": ["sh"], "k": 1, "t": "Kechqurun: Allohumma bika amsayna", "ar": "اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ الْمَصِيرُ", "tr": "Allohumma bika amsayna va bika asbahna va bika nahya va bika namutu va ilaykal-masir.", "uz": "Ey Alloh, Sening ehsoning bilan kech kirdirdik, Sening ehsoning bilan tong ottirdik, Sen bilan tirilamiz, Sen bilan o‘lamiz va qaytish Senga."}, {"id": "si", "c": ["sb", "sh"], "k": 1, "t": "Sayyidul istig‘for", "ar": "اللَّهُمَّ أَنْتَ رَبِّي لَا إِلَٰهَ إِلَّا أَنْتَ، خَلَقْتَنِي وَأَنَا عَبْدُكَ، وَأَنَا عَلَىٰ عَهْدِكَ وَوَعْدِكَ مَا اسْتَطَعْتُ، أَعُوذُ بِكَ مِنْ شَرِّ مَا صَنَعْتُ، أَبُوءُ لَكَ بِنِعْمَتِكَ عَلَيَّ، وَأَبُوءُ بِذَنْبِي فَاغْفِرْ لِي فَإِنَّهُ لَا يَغْفِرُ الذُّنُوبَ إِلَّا أَنْتَ", "tr": "Allohumma anta Rabbi, la ilaha illa ant, xalaqtani va ana ‘abduk, va ana ‘ala ‘ahdika va va‘dika mastata‘t, a‘uzu bika min sharri ma sana‘t, abu’u laka bini‘matika ‘alayya va abu’u bizanbi, fag‘firli fa innahu la yag‘firuz-zunuba illa ant.", "uz": "Ey Alloh, Sen mening Rabbimsan, Sendan o‘zga iloh yo‘q. Sen meni yaratding, men Sening bandangman va imkonim boricha ahdu va’dangda turibman. Qilgan yomonliklarimdan Sendan panoh so‘rayman. Menga bergan ne’matingni tan olaman va gunohimni tan olaman. Meni kechir, chunki gunohlarni Sendan o‘zga hech kim kechira olmaydi."}, {"id": "hs", "c": ["sb", "sh"], "k": 7, "t": "Hasbiyallohu", "ar": "حَسْبِيَ اللَّهُ لَا إِلَٰهَ إِلَّا هُوَ ۖ عَلَيْهِ تَوَكَّلْتُ ۖ وَهُوَ رَبُّ الْعَرْشِ الْعَظِيمِ", "tr": "Hasbiyallohu la ilaha illa huva ‘alayhi tavakkaltu va huva Rabbul-‘arshil-‘azim.", "uz": "Menga Alloh yetarlidir, Undan o‘zga iloh yo‘q. Faqat Unga tavakkul qildim, U ulug‘ Arsh Rabbidir. (Tavba, 129)"}, {"id": "bz", "c": ["sb", "sh"], "k": 3, "t": "Zarar yetmaslik duosi", "ar": "بِسْمِ اللَّهِ الَّذِي لَا يَضُرُّ مَعَ اسْمِهِ شَيْءٌ فِي الْأَرْضِ وَلَا فِي السَّمَاءِ وَهُوَ السَّمِيعُ الْعَلِيمُ", "tr": "Bismillahillazi la yadurru ma‘asmihi shay’un fil-arzi va la fis-sama’i va huvas-sami‘ul-‘alim.", "uz": "Ismi bilan boshlaganda yerda ham, osmonda ham hech narsa zarar yetkaza olmaydigan Alloh nomi bilan. U eshituvchi va biluvchidir."}, {"id": "sv", "c": ["sb", "sh"], "k": 100, "t": "Subhanalloh va bihamdih", "ar": "سُبْحَانَ اللَّهِ وَبِحَمْدِهِ", "tr": "Subhanallohi va bihamdih.", "uz": "Allohni poklayman va Unga hamd aytaman."}, {"id": "tl", "c": ["sb"], "k": 10, "t": "Tahlil", "ar": "لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "tr": "La ilaha illallohu vahdahu la sharika lah, lahul-mulku va lahul-hamdu va huva ‘ala kulli shay’in qadir.", "uz": "Allohdan o‘zga iloh yo‘q, U yagonadir, sherigi yo‘q. Mulk Unikidir, hamd Unga xosdir va U hamma narsaga qodirdir."}, {"id": "n1", "c": ["nm"], "k": 3, "t": "Istig‘for", "ar": "أَسْتَغْفِرُ اللَّهَ", "tr": "Astag‘firulloh.", "uz": "Allohdan mag‘firat so‘rayman."}, {"id": "n2", "c": ["nm"], "k": 1, "t": "Allohumma antas-salam", "ar": "اللَّهُمَّ أَنْتَ السَّلَامُ وَمِنْكَ السَّلَامُ، تَبَارَكْتَ يَا ذَا الْجَلَالِ وَالْإِكْرَامِ", "tr": "Allohumma antas-salam va minkas-salam, tabarakta ya zal-jalali val-ikram.", "uz": "Ey Alloh, Sen Salomsan (aybu nuqsondan xolisan), salomatlik Sendandir. Ey ulug‘lik va ikrom egasi, Sen barakotlisan."}, {"id": "n3", "c": ["nm"], "k": 33, "t": "Subhanalloh", "ar": "سُبْحَانَ اللَّهِ", "tr": "Subhanalloh.", "uz": "Alloh pokdir (har qanday nuqsondan)."}, {"id": "n4", "c": ["nm"], "k": 33, "t": "Alhamdulillah", "ar": "الْحَمْدُ لِلَّهِ", "tr": "Alhamdulillah.", "uz": "Hamd Allohgadir."}, {"id": "n5", "c": ["nm"], "k": 33, "t": "Allohu akbar", "ar": "اللَّهُ أَكْبَرُ", "tr": "Allohu akbar.", "uz": "Alloh ulug‘dir."}, {"id": "n6", "c": ["nm"], "k": 1, "t": "Tahlil bilan yuzni to‘ldirish", "ar": "لَا إِلَٰهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ، لَهُ الْمُلْكُ وَلَهُ الْحَمْدُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ", "tr": "La ilaha illallohu vahdahu la sharika lah, lahul-mulku va lahul-hamdu va huva ‘ala kulli shay’in qadir.", "uz": "Allohdan o‘zga iloh yo‘q, U yagonadir, sherigi yo‘q. Mulk Unikidir, hamd Unga xosdir va U hamma narsaga qodirdir."}, {"id": "u1", "c": ["uy"], "k": 1, "t": "Uxlashdan oldin", "ar": "بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا", "tr": "Bismika Allohumma amutu va ahya.", "uz": "Ey Alloh, Sening noming bilan o‘laman va tirilaman."}, {"id": "u2", "c": ["uy"], "k": 33, "t": "Subhanalloh (uyqudan oldin)", "ar": "سُبْحَانَ اللَّهِ", "tr": "Subhanalloh.", "uz": "Alloh pokdir."}, {"id": "u3", "c": ["uy"], "k": 33, "t": "Alhamdulillah (uyqudan oldin)", "ar": "الْحَمْدُ لِلَّهِ", "tr": "Alhamdulillah.", "uz": "Hamd Allohgadir."}, {"id": "u4", "c": ["uy"], "k": 34, "t": "Allohu akbar (uyqudan oldin)", "ar": "اللَّهُ أَكْبَرُ", "tr": "Allohu akbar.", "uz": "Alloh ulug‘dir."}, {"id": "k1", "c": ["kn"], "k": 1, "t": "Uyg‘onganda", "ar": "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", "tr": "Alhamdu lillahil-lazi ahyana ba‘da ma amatana va ilayhin-nushur.", "uz": "Bizni o‘ldirgandan keyin tiriltirgan Allohga hamd bo‘lsin, qaytish ham Unga."}, {"id": "k2", "c": ["kn"], "k": 1, "t": "Ovqatdan oldin", "ar": "بِسْمِ اللَّهِ", "tr": "Bismillah.", "uz": "Alloh nomi bilan. (Boshida unutsang: “Bismillahi avvalahu va axirah”.)"}, {"id": "k3", "c": ["kn"], "k": 1, "t": "Ovqatdan keyin", "ar": "الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنِي هَٰذَا وَرَزَقَنِيهِ مِنْ غَيْرِ حَوْلٍ مِنِّي وَلَا قُوَّةٍ", "tr": "Alhamdu lillahil-lazi at‘amani haza va razaqanihi min g‘ayri havlin minni va la quvva.", "uz": "Menga buni yedirgan va men hech kuch-quvvatsiz bo‘lgan holda rizq qilib bergan Allohga hamd bo‘lsin."}, {"id": "k4", "c": ["kn"], "k": 1, "t": "Uydan chiqayotganda", "ar": "بِسْمِ اللَّهِ، تَوَكَّلْتُ عَلَى function errGroups(rows,seen,cur){const g={};(rows||[]).forEach(e=>{const k=errSig(e.msg),x=g[k]||(g[k]={sig:k,n:0,users:new Set(),vers:{},tabs:{},first:e.created_at,last:e.created_at,st:e.stack||'',sample:e.msg,sa:0,br:0});

function rzForce(k,v){const R=S.rz,c=R.fast[k]||0;if(c===v)return;
  if(c===2){R.debt=Math.max(0,R.debt-1);const x=R.log.findIndex(y=>y.d===k&&y.k==='miss');if(x>=0)R.log.splice(x,1)}
  if(v===2){R.debt++;R.log.push({id:Date.now(),d:k,k:'miss',n:1})}R.fast[k]=v}
function nmOne(k,p){const N=S.nm,d=N.d[k]=N.d[k]||{},c=d[p]||0;if(c===1)return;
  if(c===2){N.debt[p]=Math.max(0,(N.debt[p]||0)-1);const i=N.log.findIndex(x=>x.d===k&&x.p===p&&x.k==='miss');if(i>=0)N.log.splice(i,1)}d[p]=1}

async function tgApply(){if(!sb||!UID||!TGL)return;
  try{const r=await sb.from('tg_inbox').select('*').eq('applied',false).order('id',{ascending:true}).limit(100);
    if(r.error||!r.data||!r.data.length)return;

    for(const x of r.data){ids.push(x.id);if(done.has(x.id))continue;done.add(x.id);
      const p=x.payload||{},k=/^\d{4}-\d\d-\d\d$/.test(p.d||'')?p.d:dk();if(k>dk())continue;

    S.tgd=[...done].slice(-200);

let IDK=null;
function ieDiff(ref,txt){const R=String(ref).match(/[A-Za-z0-9’']+|[^A-Za-z0-9’']+/g)||[],rw=[];R.forEach((x,i)=>{if(/[A-Za-z0-9]/.test(x))rw.push({i,t:x.toLowerCase().replace(/’/g,"'")})});
  const U=(String(txt).toLowerCase().replace(/’/g,"'").match(/[a-z0-9']+/g)||[]),n=rw.length,m=U.length,D=[...Array(n+1)].map(()=>Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=rw[i].t===U[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
  const ok=new Set();let i=0,j=0;while(i<n&&j<m){if(rw[i].t===U[j]){ok.add(rw[i].i);i++;j++}else if(D[i+1][j]>=D[i][j+1])i++;else j++}
  const hit=ok.size;return{parts:R.map((x,k)=>/[A-Za-z0-9]/.test(x)?{t:x,ok:ok.has(k)}:{t:x,p:1}),pct:n?Math.round(hit/n*100):0,missed:rw.filter(w=>!ok.has(w.i)).map(w=>R[w.i]),extra:Math.max(0,m-hit),n}}

let IAL=null;
const ieAlOk=m=>!!(m.au&&!(m.c&&m.c.length)&&(m.x||'').length>=200);
function ieAlignTx(text,cues,dur){const U=[],re=/[A-Za-z0-9’']+/g;let x;while((x=re.exec(text)))U.push({n:ieNormW(x[0]),a:x.index,b:x.index+x[0].length});

  const n=U.length,m=W.length,M=m+1,eq=(a,b)=>a===b||(a.length>=5&&b.length>=5&&a[0]===b[0]&&Math.abs(a.length-b.length)<=1&&ieLev(a,b)<=1),D=new Uint16Array((n+1)*M);
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i*M+j]=eq(U[i].n,W[j].n)?D[(i+1)*M+j+1]+1:Math.max(D[(i+1)*M+j],D[i*M+j+1]);
  const ts=new Array(n).fill(null),te=new Array(n).fill(null);let i=0,j=0,hit=0;
  while(i<n&&j<m){if(eq(U[i].n,W[j].n)){ts[i]=W[j].s;te[i]=W[j].e;hit++;i++;j++}else if(D[(i+1)*M+j]>=D[i*M+j+1])i++;else j++}
  const ratio=hit/n,end=Math.max(+dur||0,W[m-1].e);
  for(let k=0;k<n;k++)if(ts[k]===null){let a=k-1;while(a>=0&&ts[a]===null)a--;let b=k+1;while(b<n&&ts[b]===null)b++;const t0=a>=0?ts[a]:0,t1=b<n?ts[b]:end,na=a>=0?a:-1,nb=b<n?b:n;ts[k]=t0+(t1-t0)*((k-na)/(nb-na))}
  for(let k=1;k<n;k++)if(ts[k]<ts[k-1])ts[k]=ts[k-1];
  // jumlalar -> qatorlar (qisqalar birlashadi, uzunlar bo'linadi)
  const S2=ieSents(text);let ti=0,P=[];S2.forEach(sn=>{const a=ti;while(ti<n&&U[ti].a<sn.b)ti++;if(ti>a)P.push([a,ti-1])});
  const Q=[];P.forEach(p=>{if(Q.length&&Q[Q.length-1][2]){Q[Q.length-1][1]=p[1];Q[Q.length-1][2]=(Q[Q.length-1][1]-Q[Q.length-1][0]+1)<4;return}Q.push([p[0],p[1],(p[1]-p[0]+1)<4])});
  const R=[];Q.forEach(q=>{const len=q[1]-q[0]+1;if(len>26){const k=Math.ceil(len/18),sz=Math.ceil(len/k);for(let a=q[0];a<=q[1];a+=sz)R.push([a,Math.min(q[1],a+sz-1)])}else R.push([q[0],q[1]])});

    return [Math.round(s*100)/100,Math.round(e*100)/100,text.slice(U[a].a,U[b].b+mt.length).replace(/\s+/g,' ').trim(),ts.slice(a,b+1).map(v=>Math.round(v*100)/100)]});
