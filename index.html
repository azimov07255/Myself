function bkLd(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>bkApply(r.result);r.readAsText(f)}
function bkTx(){const t=prompt('Zaxira matnini shu yerga qo‘ying:');if(t)bkApply(t)}

async function fn(body){const r=await sb.functions.invoke('create-user',{body});
  if(!r.error)return r.data;
  try{return await r.error.context.json()}catch(e){return{error:'Funksiya topilmadi yoki ishlamadi'}}}
async function loadOw(){const d=await fn({action:'list'});OW=d&&d.users?d.users:false;render()}
function genP(){const c='abcdefghjkmnpqrstuvwxyz23456789';OP=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>c[x%c.length]).join('');render()}
async function mkU(){
  const l=OL.trim().toLowerCase();
  if(!/^[a-z0-9_.]{3,20}$/.test(l)||OP.length<6){OE='Login 3–20 ta lotin harf yoki raqam, parol kamida 6 belgi bo‘lsin.';return render()}
  const d=await fn({action:'create',login:l,password:OP,name:ON.trim()});
  if(!d||d.error){OE=(d&&d.error)||'Xato';return render()}
  OC={login:l,pass:OP};OL=OP=ON=OE='';await loadOw();
}
async function du(id){if(!confirm('Foydalanuvchi va uning ma‘lumoti o‘chirilsinmi?'))return;const d=await fn({action:'delete',id});OE=d&&d.error?d.error:'';await loadOw()}
function cp(){const t='Kunlik tizim\nLink: '+location.origin+location.pathname+'\nLogin: '+OC.login+'\nParol: '+OC.pass;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{OC.copied=1;render()}).catch(()=>{prompt('Nusxalang:',t)})}
function owner(){
  if(!Array.isArray(OW))return '';
  const us=OW.map(u=>`<div class="row"><span class="t">${esc((u.email||'').replace('@trk.app',''))}${u.name?`<br><span class="mu">${esc(u.name)}</span>`:''}</span><button class="x" onclick="du('${u.id}')">×</button></div>`).join('');
  const card=OC?`<div class="goal" style="border:1px solid var(--go)"><b>Tayyor. Yuborish uchun nusxala</b><p class="mu" style="margin:6px 0 10px">Login: ${esc(OC.login)}<br>Parol: ${esc(OC.pass)}</p><button class="btn" onclick="cp()">${OC.copied?'Nusxalandi':'Nusxalash'}</button></div>`:'';
  return `<h2>Foydalanuvchilar</h2>${card}<div class="in"><input placeholder="Login (masalan: aziz01)" value="${esc(OL)}" oninput="OL=this.value" autocapitalize="none"></div><div class="in"><input placeholder="Parol (kamida 6 belgi)" value="${esc(OP)}" oninput="OP=this.value" autocapitalize="none"></div><button class="ghost" style="margin:0 0 8px" onclick="genP()">Parol yaratish</button><div class="in"><input placeholder="Ism (ixtiyoriy)" value="${esc(ON)}" oninput="ON=this.value"></div><p class="err">${esc(OE)}</p><button class="big" style="margin:0 0 14px" onclick="mkU()">Foydalanuvchi qo‘shish</button>${us}`;
}
async function out(){try{await sb.auth.signOut()}catch(e){}try{localStorage.removeItem('trk_uid')}catch(e){}UID=null;OW=null;OC=null;S=blank();render()}
function err(t){const e=$('#er');if(e)e.textContent=t}
async function auth(up){
  const l=$('#lg').value.trim().toLowerCase(),p=$('#pw').value;
  if(!l.includes('@')&&!/^[a-z0-9_.]{3,20}$/.test(l))return err('Login 3–20 ta lotin harf yoki raqamdan iborat bo‘lsin.');
  if(p.length<6)return err('Parol kamida 6 belgidan iborat bo‘lsin.');
  const c={email:l.includes('@')?l:l+'@trk.app',password:p};
  const r=up?await sb.auth.signUp(c):await sb.auth.signInWithPassword(c);
  if(r.error)return err(/invalid/i.test(r.error.message)?'Login yoki parol noto‘g‘ri.':r.error.message);
    await start(r.data.session.user.id);
}
async function start(id){UID=id;try{localStorage.setItem('trk_uid',id)}catch(e){}S=load();await pull();try{if(localStorage.getItem('trk_dirty'))push()}catch(e){}render()}
(async()=>{
  if(!sb){S=load();render()}
  else{
    let ok=false;
    try{const r=await sb.auth.getSession();if(r.data&&r.data.session){ok=true;await start(r.data.session.user.id)}}catch(e){}
    if(!ok){let u=null;try{u=localStorage.getItem('trk_uid')}catch(e){}if(u&&navigator.onLine===false)await start(u);else render()}
  }
  setInterval(()=>{const a=document.activeElement;if(!a||a.tagName!=='INPUT')render()},30000);
  window.addEventListener('online',()=>{SYNC='ok';let d=null;try{d=localStorage.getItem('trk_dirty')}catch(e){}if(d)push();render()});
  window.addEventListener('offline',()=>{SYNC='off';render()});
  if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
